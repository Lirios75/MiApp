<style type="text/tailwindcss">
  @theme {
    --font-display: "Fraunces", Georgia, serif;
    --font-sans: "Poppins", ui-sans-serif, sans-serif;
    --color-bg: #F5F1E8;
    --color-surface: #FBF8F1;
    --color-sunken: #ECE6D8;
    --color-line: #E2DACA;
    --color-ink: #3C3428;
    --color-ink2: #5C5442;
    --color-ink3: #857A66;
    --color-brand: #3A6478;
    --color-brand-deep: #2E5162;
    --color-brand-soft: #DCE7EC;
    --color-on-brand: #E8EFF2;
    --color-on-brand2: #BBD0DA;
    --color-ok: #4C7A57;
    --color-ok-soft: #E1EBDD;
    --color-warn: #A86A12;
    --color-warn-soft: #F6E7C8;
    --color-bad: #A3453A;
    --color-bad-soft: #F3DCD6;
  }
  @layer base {
    html { -webkit-tap-highlight-color: transparent; }
    body { @apply bg-bg text-ink font-sans antialiased; font-size: 15px; }
    h1, h2, h3, .font-display { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.01em; }
    :focus-visible { outline: 2px solid var(--color-brand); outline-offset: 2px; }
    input, select, textarea { font: inherit; color: inherit; }
  }
  @layer components {
    .card, .kcard { @apply bg-surface rounded-2xl border border-line; box-shadow: 0 1px 0 rgba(60,52,40,.04), 0 6px 18px -10px rgba(60,52,40,.18); }
    .btn, .btn-primary, .btn-ghost, .btn-soft { @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 min-h-11 text-sm font-medium transition active:scale-[.97] disabled:opacity-50 cursor-pointer select-none; }
    .btn-primary { @apply bg-brand text-on-brand hover:bg-brand-deep; }
    .btn-ghost { @apply bg-transparent text-ink2 hover:bg-sunken; }
    .btn-soft { @apply bg-sunken text-ink hover:bg-line; }
    .btn-sm { @apply min-h-9 px-3 text-[13px] rounded-lg; }
    .chip { @apply inline-flex items-center gap-1.5 rounded-full px-3 min-h-9 text-[13px] font-medium border border-line bg-surface text-ink2 whitespace-nowrap cursor-pointer transition; }
    .chip[aria-pressed="true"] { @apply bg-brand text-on-brand border-brand; }
    .tag { @apply inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11.5px] font-medium whitespace-nowrap; }
    .field { @apply flex flex-col gap-1.5 min-w-0; }
    .field > span { @apply text-[12.5px] font-medium text-ink2; }
    .input { @apply w-full rounded-xl border border-line bg-bg px-3 min-h-11 text-[15px] outline-none transition focus:border-brand focus:bg-surface; }
    textarea.input { @apply py-2.5 min-h-24; }
    .label { @apply text-[12px] font-medium text-ink3 uppercase tracking-[0.06em]; }
    .icon-chip { @apply grid place-items-center w-10 h-10 rounded-xl shrink-0; }
    .navlink { @apply flex items-center gap-3 rounded-xl px-3 min-h-11 text-[14.5px] text-on-brand2 hover:bg-white/10 transition; }
    .navlink[aria-current="page"] { @apply bg-on-brand text-brand font-medium; }
    .tabbtn { @apply flex flex-col items-center justify-center gap-0.5 text-[11px] text-ink3 min-h-14 flex-1; }
    .tabbtn[aria-current="page"] { @apply text-brand font-medium; }
    .tabbtn[aria-current="page"] .tabdot { @apply bg-brand-soft; }
    .tabdot { @apply grid place-items-center w-12 h-7 rounded-full transition; }
    .kcol { @apply min-w-0 rounded-2xl bg-sunken/70 p-2.5 flex flex-col gap-2 min-h-40; }
    .kcard { @apply p-3 cursor-pointer hover:border-brand/40 transition; }
    .dot { @apply inline-block w-2 h-2 rounded-full shrink-0; }
  }
  .fade-in { animation: fadeIn .28s cubic-bezier(.2,.7,.2,1) both; }
  .stagger > * { animation: fadeIn .32s cubic-bezier(.2,.7,.2,1) both; }
  .stagger > *:nth-child(2) { animation-delay: 50ms } .stagger > *:nth-child(3) { animation-delay: 100ms }
  .stagger > *:nth-child(4) { animation-delay: 150ms } .stagger > *:nth-child(5) { animation-delay: 200ms }
  .stagger > *:nth-child(n+6) { animation-delay: 250ms }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .sheet { animation: sheetIn .26s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  @media (max-width: 767px) { body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--color-brand); } }
  @media (min-width: 768px) { .gutter { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
  body { background: radial-gradient(1200px 500px at 85% -10%, #E9EEEA 0%, transparent 60%), radial-gradient(900px 400px at -10% 110%, #EFE6D3 0%, transparent 60%), var(--color-bg); }
  .scroll-x { overflow-x: auto; scrollbar-width: none; } .scroll-x::-webkit-scrollbar { display: none; }
  .bar { transform-origin: left; animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  .drop-target { outline: 2px dashed var(--color-brand); outline-offset: -2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  [data-lucide] { width: 1em; height: 1em; }
  svg.lucide { stroke-width: 1.8; }
</style>
</head>
<body>
<div id="app" class="min-h-dvh"></div>
<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="toast-root" class="fixed z-50 left-1/2 -translate-x-1/2 bottom-24 md:bottom-6 w-[min(92vw,420px)]"></div>

<script>
/* =========================================================
   Lirios CRM — un solo archivo, guarda todo en este navegador
   ========================================================= */
const STORAGE_KEY = 'lirios-crm-v1';

/* ---------- Catálogos ---------- */
const VENTAS = [
  { id: 'prospecto', nombre: 'Por llamar', sub: 'Prospectos' },
  { id: 'cita1', nombre: 'Cita 1ª', sub: 'Descubrimiento' },
  { id: 'propuesta', nombre: 'Propuesta', sub: 'Elaboración de la propuesta' },
  { id: 'cita2', nombre: 'Cita 2ª', sub: 'Presentación y cierre' },
  { id: 'tramite', nombre: 'Radicada', sub: 'En estudio de la aseguradora' },
  { id: 'emitida', nombre: 'Póliza emitida', sub: 'Pasa a posventa' },
  { id: 'standby', nombre: 'En pausa', sub: 'Retomar más adelante' },
];
const POSVENTA = [
  { id: 'activa', nombre: 'Pólizas activas', sub: 'Vigentes y al día', tono: 'ok' },
  { id: 'renovacion', nombre: 'Renovación próxima', sub: 'Aniversario en ≤ 60 días', tono: 'warn' },
  { id: 'pago', nombre: 'Alerta de pago', sub: 'Recibo en ≤ 15 días', tono: 'warn' },
  { id: 'gracia', nombre: 'Periodo de gracia', sub: 'Recibo vencido', tono: 'bad' },
  { id: 'conservada', nombre: 'Conservada / renovada', sub: 'Ciclo completado', tono: 'ok' },
];
const ESTADOS = ['Prospecto Frío','Contactado','Cita 1 Agendada','Cita 1 Realizada','Cita 2 Agendada','Cita 2 Realizada','Radicada (en estudio)','Cliente Activo','En Renovación','Cancelada','En pausa'];
const RAMOS = ['Vida','Retiro','Gastos Médicos','Ahorro/Inversión','Accidentes personales','Hogar'];
const CAPAS = ['Protección','Patrimonio','Liquidez','Retiro','Salud'];
const FORMAS = { Anual: 12, Semestral: 6, Trimestral: 3, Mensual: 1 };
const MONEDAS = [['COP', 'Pesos (COP)'], ['USD', 'Dólares (USD)']];
const CODIGOS_MONEDA = MONEDAS.map(m => m[0]);
const TASA_USD_INICIAL = 4000;
const OBJETIVOS_BASE = { referidos: [10, 50], intentos: [0, 0], efectivos: [7, 35], rechazos: [0, 0], ands: [2, 10], c1ag: [3, 15], c1re: [3, 15], c2ag: [1, 5], c2re: [1, 4], svag: [0, 2], svre: [0, 0], vida: [0, 1], ap: [0, 1], nbs: [0, 0] };
const ALIADAS = ['MetLife', 'Allianz', 'BMI', 'Skandia', 'SURA'];
const PRIORIDADES = ['Alta','Media','Baja'];
const EDADES = ['18-25','26-35','36-45','46-55','56-65','65+'];
const CIVILES = ['Soltero(a)','Casado(a)','Unión libre','Divorciado(a)','Viudo(a)'];
const TIPOS_CITA = {
  cita1: 'Cita 1ª · Descubrimiento',
  cita2: 'Cita 2ª · Propuesta',
  anual: 'Revisión anual',
  posventa: 'Seguimiento posventa',
};
/* Color por tipo de cita: verde 1ª (venta), azul 2ª (propuesta), amarillo servicio a clientes */
const COLOR_CITA = { cita1: ['bg-ok-soft text-ok', '1ª cita'], cita2: ['bg-brand-soft text-brand', '2ª cita'], anual: ['bg-warn-soft text-warn', 'Servicio'], posventa: ['bg-warn-soft text-warn', 'Servicio'] };
const tipoTag = t => `<span class="tag ${(COLOR_CITA[t] || COLOR_CITA.posventa)[0]} shrink-0">${(COLOR_CITA[t] || COLOR_CITA.posventa)[1]}</span>`;
const RAMO_ICON = { 'Vida': 'heart-handshake', 'Retiro': 'sunset', 'Gastos Médicos': 'stethoscope', 'Ahorro/Inversión': 'piggy-bank', 'Accidentes personales': 'shield-plus', 'Hogar': 'home' };

/* ---------- Fechas (siempre YYYY-MM-DD en hora local) ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const hoy = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (s, n) => {
  const d = parse(s), day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  return iso(d);
};
const diasEntre = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const diasHasta = s => diasEntre(hoy(), s);
const mesesEntre = (a, b) => { const x = parse(a), y = parse(b); return (y.getFullYear() - x.getFullYear()) * 12 + (y.getMonth() - x.getMonth()); };
const fFecha = (s, opts = { day: 'numeric', month: 'short' }) => s ? parse(s).toLocaleDateString('es-CO', opts).replace('.', '') : '—';
const fFechaLarga = s => { const t = fFecha(s, { weekday: 'long', day: 'numeric', month: 'long' }); return t[0].toUpperCase() + t.slice(1); };
const fHora = h => { if (!h) return ''; const [H, M] = h.split(':').map(Number); return `${((H + 11) % 12) + 1}:${pad(M)} ${H < 12 ? 'am' : 'pm'}`; };
const relDias = n => n === 0 ? 'hoy' : n === 1 ? 'mañana' : n === -1 ? 'ayer' : n > 0 ? `en ${n} días` : `hace ${-n} días`;
const lunesDe = s => { const d = parse(s); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return iso(d); };

/* Recibos: se cuentan siempre desde el inicio de vigencia para no "derivar" en meses de 31 */
function siguienteRecibo(inicio, forma, despuesDe) {
  const m = FORMAS[forma] || 12;
  for (let k = 1; k < 1200; k++) { const f = addMonths(inicio, k * m); if (f > despuesDe) return f; }
  return addMonths(despuesDe, m);
}
function reciboVigente(inicio, forma) {
  const m = FORMAS[forma] || 12, t = hoy();
  for (let k = 1; k < 1200; k++) { const f = addMonths(inicio, k * m); if (f >= t) return f; }
  return null;
}
function proximoAniversario(inicio) {
  const t = hoy();
  for (let k = 1; k < 100; k++) { const f = addMonths(inicio, 12 * k); if (f >= t) return f; }
  return null;
}

/* ---------- Dinero ---------- */
/* Pesos y dólares nunca se mezclan: cada total se lleva por moneda */
function sumarPorMoneda(items, monto, moneda) {
  const t = { USD: 0, COP: 0 };
  items.forEach(x => { t[moneda(x) === 'USD' ? 'USD' : 'COP'] += Number(monto(x)) || 0; });
  return t;
}
const textosMoneda = t => [t.USD && fDinero(Math.round(t.USD), 'USD', true), t.COP && fDinero(t.COP, 'COP', true)].filter(Boolean);
const fSumaMonedas = t => textosMoneda(t).join(' · ') || '$0';
function fDinero(monto, moneda = 'COP', compacto = false) {
  const n = Number(monto) || 0, pre = moneda === 'USD' ? 'US$' : '$';
  const num = (v, d = 0) => v.toLocaleString('es-CO', { maximumFractionDigits: d });
  if (compacto && n >= 1e9) return `${pre}${num(n / 1e9, 1)} mil M`;
  if (compacto && n >= 1e6) return `${pre}${num(n / 1e6, 1)} M`;
  return pre + num(n, moneda === 'USD' ? 2 : 0);
}

/* ---------- Utilidades ---------- */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const iniciales = n => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const ahoraTexto = () => new Date().toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const soloDigitos = s => String(s || '').replace(/\D/g, '');
const icon = (name, cls = '') => `<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;

/* ---------- Reglas de negocio ---------- */
/* Un contacto puede tener varias pólizas; cobranza, renovación y semáforo se miden por póliza */
const esCliente = c => c.etapa === 'emitida';
const enVentas = c => !esCliente(c) && c.etapa !== 'cancelada';
const activa = p => !p.estado || p.estado === 'vigente';
const vigentes = c => (c.polizas || []).filter(activa);
const polizasCartera = () => db.contactos.filter(esCliente).flatMap(c => vigentes(c).map(p => ({ c, p })));
const primaRecibo = p => (Number(p.prima) || 0) / (12 / (FORMAS[p.formaPago] || 12));

/* Aniversario que aún falta por pagar: si el recibo del aniversario ya se pagó, la renovación está hecha */
function aniversarioPendiente(p) {
  const ani = p.inicioVigencia ? proximoAniversario(p.inicioVigencia) : null;
  return ani && (!p.proxVencimiento || p.proxVencimiento <= ani) ? ani : null;
}
function cubeta(p) {
  if (!p.proxVencimiento) return 'activa';
  const dv = diasHasta(p.proxVencimiento);
  if (p.gracia || dv < 0) return 'gracia';
  if (dv <= 15) return 'pago';
  const ani = aniversarioPendiente(p);
  if (ani && diasHasta(ani) <= 60) return 'renovacion';
  if (p.renovadoEn && diasEntre(p.renovadoEn, hoy()) <= 90) return 'conservada';
  return 'activa';
}
function semaforo(p) {
  if (cubeta(p) === 'gracia') return 'bad';
  const dv = p.proxVencimiento ? diasHasta(p.proxVencimiento) : 999;
  const ani = aniversarioPendiente(p);
  if (dv <= 15 || (ani && diasHasta(ani) < 30)) return 'warn';
  return 'ok';
}
const PESO_TONO = { bad: 3, warn: 2, ok: 1 };
function semaforoContacto(c) {
  if (!esCliente(c)) return null;
  return vigentes(c).map(semaforo).sort((a, b) => PESO_TONO[b] - PESO_TONO[a])[0] || null;
}
function estadoDe(c) {
  if (c.etapa === 'cancelada') return c.rechazoEn ? 'No le interesa' : 'Cancelada';
  if (c.etapa === 'standby') return 'En pausa';
  if (esCliente(c)) return vigentes(c).some(p => cubeta(p) === 'renovacion') ? 'En Renovación' : 'Cliente Activo';
  return c.estado || 'Prospecto Frío';
}
function proximaCita(c) {
  return (c.citas || []).filter(x => x.status === 'programada').sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora))[0];
}
function todasCitas() {
  return db.contactos.flatMap(c => (c.citas || []).map(ci => ({ ...ci, contacto: c })));
}
function lineaGracia(p) {
  const dv = diasHasta(p.proxVencimiento);
  if (dv < -30) return `Vencido hace ${-dv} días · fuera de tolerancia`;
  if (dv < 0) return `Vencido hace ${-dv} días · quedan ${30 + dv} de gracia`;
  return 'Marcado en periodo de gracia';
}
function edadDe(nac) {
  if (!nac) return null;
  const n = parse(nac), t = new Date();
  let e = t.getFullYear() - n.getFullYear();
  if (t.getMonth() < n.getMonth() || (t.getMonth() === n.getMonth() && t.getDate() < n.getDate())) e--;
  return e;
}
const rangoEdad = e => e == null ? '36-45' : e <= 25 ? '18-25' : e <= 35 ? '26-35' : e <= 45 ? '36-45' : e <= 55 ? '46-55' : e <= 65 ? '56-65' : '65+';
function proximoCumple(nac) {
  if (!nac) return null;
  const n = parse(nac), y = new Date().getFullYear();
  const f = iso(new Date(y, n.getMonth(), n.getDate()));
  return f >= hoy() ? f : iso(new Date(y + 1, n.getMonth(), n.getDate()));
}
function textoBusqueda(c) {
  return [c.nombre, c.cedula, c.prioridad, c.telefono, c.email, c.ramo, c.ciudad, ...(c.polizas || []).flatMap(p => [p.numero, p.aseguradora, p.plan])].join(' ').toLowerCase();
}
function nuevaPoliza(o = {}) {
  return { id: uid(), numero: '', aseguradora: '', plan: '', capa: '', ramo: 'Vida', formaPago: 'Anual', inicioVigencia: '', proxVencimiento: '',
    prima: 0, moneda: 'COP', sumaAsegurada: 0, estado: 'vigente', gracia: false, renovadoEn: null, renovaciones: 0, pagos: [], ...o };
}
/* Formato anterior: una sola póliza guardada dentro del contacto. Se pasa a la lista de pólizas */
function aFormatoPolizas(c) {
  if (Array.isArray(c.polizas)) return c;
  const tiene = !!(c.poliza || c.inicioVigencia);
  c.polizas = tiene ? [nuevaPoliza({ numero: c.poliza || '', aseguradora: c.aseguradora || '', ramo: c.ramo || 'Vida', formaPago: c.formaPago || 'Anual',
    inicioVigencia: c.inicioVigencia || '', proxVencimiento: c.proxVencimiento || '', prima: c.prima || 0, moneda: c.moneda || 'COP',
    estado: c.etapa === 'cancelada' ? 'cancelada' : 'vigente', gracia: !!c.gracia, renovadoEn: c.renovadoEn || null, renovaciones: c.renovaciones || 0, pagos: c.pagos || [] })] : [];
  ['poliza', 'aseguradora', 'formaPago', 'inicioVigencia', 'proxVencimiento', 'gracia', 'renovadoEn', 'renovaciones', 'pagos', '_pendienteEmitir'].forEach(k => delete c[k]);
  if (tiene) c.prima = 0;
  return c;
}

/* ---------- Datos de ejemplo (fechas relativas al día en que se crean) ---------- */
function semilla() {
  const T = hoy();
  const c = (o) => ({ id: uid(), telefono: '', whatsapp: '', email: '', ocupacion: '', edad: '36-45', civil: 'Casado(a)', hijos: 0,
    prioridad: 'Media', ramo: 'Vida', aseguradora: '', poliza: '', formaPago: 'Anual', inicioVigencia: '', proxVencimiento: '',
    prima: 0, moneda: 'COP', etapa: 'prospecto', estado: 'Prospecto Frío', gracia: false, renovadoEn: null, renovaciones: 0,
    fueCliente: false, hitos: {}, notas: [], citas: [], pagos: [], creado: addDays(T, -40), demo: true, ...o });
  const nota = (dias, texto) => ({ id: uid(), fecha: addDays(T, dias), hora: '10:30', texto });
  const cita = (o) => ({ id: uid(), hora: '10:00', modalidad: 'Virtual', link: '', objetivo: '', status: 'programada', reagendas: 0, bitacora: [], ...o });

  const inicioRicardo = addMonths(addDays(T, 6), -15);
  const inicioDaniela = addMonths(addDays(T, -12), -18);
  const inicioPatricia = addMonths(addDays(T, 25), -36);
  const inicioFernando = addMonths(addDays(T, -20), -24);
  const inicioSofia = addDays(T, -12);

  return [
    c({ nombre: 'Mariana Robles Treviño', telefono: '300 341 2889', whatsapp: '3003412889', email: 'mariana.robles@correo.mx', ocupacion: 'Arquitecta independiente',
      edad: '26-35', civil: 'Casado(a)', hijos: 1, prioridad: 'Alta', ramo: 'Vida', prima: 2400000, moneda: 'COP', etapa: 'cita1', estado: 'Cita 1 Agendada',
      notas: [nota(-3, 'Referida por Sofía Castañeda. Le preocupa proteger a su hija si a ella le pasa algo; su esposo no tiene seguro.')],

let db;
function cargar() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.contactos)) return d; }
  } catch (e) { console.warn('No se pudo leer el guardado', e); }
  return null;
}
function guardarLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); return true; } catch (e) { return false; }
}
function guardar() {
  db.guardadoEn = new Date().toISOString();
  const ok = guardarLocal();
  if (nube.db) { subirCambios(); return; }
  estadoGuardado(ok);
  if (!ok) toast('No se pudo guardar en este navegador. Descarga un respaldo desde Ajustes.', { tono: 'bad' });
}
function estadoGuardado(ok) {
  const hora = new Date().toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' });
  document.querySelectorAll('[data-saved]').forEach(el => {
    el.innerHTML = !ok ? `${icon('cloud-off', 'w-3.5 h-3.5')} Sin guardar` : nube.db ? `${icon('cloud-check', 'w-3.5 h-3.5')} Guardado en tu cuenta ${hora}` : `${icon('hard-drive', 'w-3.5 h-3.5')} Guardado en este navegador ${hora}`;
  });
  pintarIconos();
}

/* ---------- Guardado en tu cuenta (cuando el CRM se abre como página publicada en Claude) ----------
   Cada contacto es un documento en crm/lirios/contactos/<id>; los ajustes viven en crm/lirios.
   Solo se suben los contactos que cambiaron, uno a la vez. */
const RUTA_NUBE = 'crm/lirios';
const nube = { db: null, listo: false, sincronizado: new Map(), ajustes: '', remotos: null, meta: undefined, cola: Promise.resolve(), actividad: null };
const ajustesNube = () => JSON.stringify({ usd: Number(db.ajustes.usd) || TASA_USD_INICIAL, esDemo: !!db.esDemo, version: db.version || 3, objetivos: db.objetivos || OBJETIVOS_BASE });
async function conectarNube() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  let store = null;
  try { store = await window.claude.use('db'); } catch (e) { store = null; }
  if (!store) { sinNube(); return; }
  nube.db = store;
  const fallo = () => { nube.db = null; sinNube(); toast('No pude conectar con tu cuenta. Por ahora se guarda en este navegador.', { tono: 'bad' }); };
  /* La primera entrega puede venir de una copia previa (fromCache); para arrancar se espera la definitiva */
  const definitiva = s => nube.listo || !(s.metadata && s.metadata.fromCache);
  store.doc(RUTA_NUBE).onSnapshot(s => { if (!definitiva(s)) return; nube.meta = s.exists ? s.data() : null; aplicarNube(); }, fallo);
  store.doc(RUTA_NUBE + '/registro/actividad').onSnapshot(s => {
    if (!definitiva(s)) return;
    const remoto = JSON.stringify((s.exists && s.data().dias) || {});
    nube.actividad = remoto;
    if (remoto !== JSON.stringify(db.actividad || {})) { db.actividad = JSON.parse(remoto); guardarLocal(); if (!ui.cargando) render(); }
  }, fallo);
  store.collection(RUTA_NUBE + '/contactos').onSnapshot(s => { if (!definitiva(s)) return; nube.remotos = s.docs.map(d => JSON.parse(JSON.stringify(d.data()))); aplicarNube(); }, fallo);
  setTimeout(() => { if (ui.cargando) { ui.cargando = false; render(); toast('Tu cuenta está tardando en responder. Te muestro lo último guardado en este equipo; se actualiza solo al llegar.', { tono: 'bad' }); } }, 15000);
}
function sinNube() {
  if (!ui.cargando) return;
  ui.cargando = false;
  if (!db.contactos.length && !cargar()?.contactos?.length) { db.contactos = semilla(); db.esDemo = true; guardarLocal(); }
  render();
}
function aplicarNube() {
  if (nube.meta === undefined || nube.remotos === null) return;
  const primeraVez = !nube.listo;
  if (primeraVez) {
    nube.listo = true;
    ui.cargando = false;
    if (!nube.meta && !nube.remotos.length) { subirCambios(); render(); return; }
  }
  const remotos = new Map(nube.remotos.map(c => [c.id, JSON.stringify(c)]));
  if (nube.meta) {
    const objetivosRemotos = nube.meta.objetivos || db.objetivos || OBJETIVOS_BASE;
    nube.ajustes = JSON.stringify({ usd: Number(nube.meta.usd) || TASA_USD_INICIAL, esDemo: !!nube.meta.esDemo, version: nube.meta.version || 3, objetivos: objetivosRemotos });
    db.ajustes.usd = Number(nube.meta.usd) || db.ajustes.usd;
    db.esDemo = !!nube.meta.esDemo;
    if (JSON.stringify(objetivosRemotos) !== JSON.stringify(db.objetivos)) { db.objetivos = objetivosRemotos; if (!primeraVez) render(); }
  }
  const locales = new Map(db.contactos.map(c => [c.id, JSON.stringify(c)]));
  const igual = remotos.size === locales.size && [...remotos].every(([id, js]) => locales.get(id) === js);
  nube.sincronizado = remotos;
  if (igual) { if (primeraVez) render(); estadoGuardado(true); return; }
  db.contactos = nube.remotos.map(c => aFormatoPolizas(JSON.parse(JSON.stringify(c))));
  guardarLocal();
  render();
  const formulario = document.querySelector('#modal-root form');
  if (ui.detalle && !formulario) { if (getC(ui.detalle)) abrirDetalle(ui.detalle, true); else cerrarModal(); }
}
function subirCambios() {
  if (!nube.db || !nube.listo) return;
  nube.cola = nube.cola.then(async () => {
    const actuales = new Map(db.contactos.map(c => [c.id, JSON.stringify(c)]));
    for (const [id, js] of actuales) {
      if (nube.sincronizado.get(id) === js) continue;
      await nube.db.doc(`${RUTA_NUBE}/contactos/${id}`).set(JSON.parse(js));
      nube.sincronizado.set(id, js);
    }
    for (const id of [...nube.sincronizado.keys()]) {
      if (actuales.has(id)) continue;
      await nube.db.doc(`${RUTA_NUBE}/contactos/${id}`).delete();
      nube.sincronizado.delete(id);
    }
    const a = ajustesNube();
    if (a !== nube.ajustes) { await nube.db.doc(RUTA_NUBE).set(JSON.parse(a)); nube.ajustes = a; }
    const act = JSON.stringify(db.actividad || {});
    if (nube.actividad !== null && act !== nube.actividad) { await nube.db.doc(RUTA_NUBE + '/registro/actividad').set({ dias: JSON.parse(act) }); nube.actividad = act; }
    estadoGuardado(true);
  }).catch(e => {
    estadoGuardado(false);
    toast(e && e.code === 'quota_exceeded' ? 'Se llenó el espacio de tu CRM en la cuenta. Descarga un respaldo y borra contactos que ya no uses.'
      : 'No pude guardar en tu cuenta. El cambio quedó en este navegador y lo vuelvo a intentar con tu próximo cambio.', { tono: 'bad' });
  });
}

function confirmar(texto, { si = 'Sí, continuar', no = 'Cancelar', peligro = false } = {}) {
  return new Promise(resolver => {
    const root = document.getElementById('confirm-root');
    root.innerHTML = `<div class="fixed inset-0 z-[60] grid place-items-center p-4" role="alertdialog" aria-modal="true" aria-label="Confirmar">
      <div class="absolute inset-0 bg-ink/50 fade-in" data-r="0"></div>
      <div class="sheet relative w-full max-w-sm bg-bg rounded-3xl p-5 shadow-2xl">
        <p class="text-[15px] whitespace-pre-line">${esc(texto)}</p>
        <div class="flex gap-2 mt-5"><button class="btn-ghost flex-1" data-r="0">${esc(no)}</button><button class="${peligro ? 'btn bg-bad text-white hover:opacity-90' : 'btn-primary'} flex-1" data-r="1">${esc(si)}</button></div>
      </div></div>`;
    const cerrar = v => { root.innerHTML = ''; resolver(v); };
    root.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); cerrar(b.dataset.r === '1'); }));
    root.querySelector('button[data-r="1"]').focus();
    root.cancelar = () => cerrar(false);
  });
}

/* ---------- Descargas: en la página publicada pasan por la confirmación de Claude ---------- */
async function descargar(nombre, contenido, tipo) {
  const servicio = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads').catch(() => null) : null;
  if (servicio) {
    try { await servicio.save({ filename: nombre, data: contenido }); return true; }
    catch (e) { if (e && e.code !== 'unavailable') return false; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenido], { type: tipo })); a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return true;
}
/* Abierto dentro de Claude, la cartera llega de tu cuenta: no se muestran ejemplos mientras carga */
const enClaude = !!(window.claude && typeof window.claude.use === 'function');
db = cargar() || { version: 3, ajustes: { usd: TASA_USD_INICIAL, nombre: 'Lirios Agencia de Vida' }, contactos: enClaude ? [] : semilla(), esDemo: !enClaude };
if (!cargar()) guardar();
/* Versión 2: el CRM pasa a pesos colombianos + dólares (antes MXN/USD/UDIs) */
if ((db.version || 1) < 2) {
  if (db.esDemo) {
    const nombres = new Set(semilla().map(c => c.nombre));
    db.contactos = [...semilla(), ...db.contactos.filter(c => !c.demo && !nombres.has(c.nombre))];
  }
  db.contactos.forEach(c => { if (!CODIGOS_MONEDA.includes(c.moneda)) c.moneda = 'COP'; (c.pagos || []).forEach(p => { if (!CODIGOS_MONEDA.includes(p.moneda)) p.moneda = c.moneda; }); });
  db.ajustes = { ...db.ajustes, usd: TASA_USD_INICIAL }; delete db.ajustes.udi;
  db.version = 2; guardar();
}
/* Versión 3: cada contacto guarda una lista de pólizas (antes, una sola dentro del contacto) */
if (db.version < 3) { db.contactos.forEach(aFormatoPolizas); db.version = 3; guardar(); }
/* Guardados anteriores no marcaban los ejemplos: se reconocen por nombre para no borrar contactos reales */
if (db.esDemo && !db.contactos.some(c => c.demo)) {
  const nombres = new Set(semilla().map(c => c.nombre));
  db.contactos.forEach(c => { if (nombres.has(c.nombre)) c.demo = true; });
  guardar();
}
db.objetivos = db.objetivos || { ...OBJETIVOS_BASE };
db.actividad = db.actividad || {};
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* Resumen de la semana en curso dentro de la tarjeta de citas */
function resumenSemana() {
  const [ini, fin] = rangoPeriodo('semana', hoy());
  const s = statsCitas(ini, fin);
  const datos = [['Agendadas', s.total], ['Efectivas', s.ef], ['Pendientes', s.pen], ['Reagendadas', s.reag], ['Plantón o cancelada', s.no + s.can]];

      <h3 class="font-sans! text-[12px] font-medium uppercase tracking-[0.06em] text-on-brand2 min-w-0 truncate">Esta semana <span class="normal-case tracking-normal">(${fFecha(ini)} – ${fFecha(fin)})</span></h3>
      <button class="text-[13px] text-on-brand2 hover:text-on-brand flex items-center gap-1 shrink-0" data-act="ver-stats" aria-label="Ver estadísticas de citas">Ver más ${icon('arrow-right', 'w-3.5 h-3.5')}</button>

    </div>

  </div>`;
}
function kpiBloque(label, valor, sub, ic, color) {
  return `<div class="lg:px-5 first:lg:pl-0 min-w-0"><p class="label flex items-center gap-1.5">${icon(ic, `w-3.5 h-3.5 ${color}`)} ${label}</p>
    <p class="font-display text-[24px] md:text-[28px] leading-tight mt-1 ${color} tabular-nums">${valor}</p><p class="text-[12.5px] text-ink3 truncate">${sub}</p></div>`;
}
const valorMonedas = t => (textosMoneda(t).length ? textosMoneda(t) : ['$0']).map(v => `<span class="block whitespace-nowrap">${v}</span>`).join('');
function kpis() {
  const cs = db.contactos;
  const pipeline = cs.filter(c => enVentas(c) && c.etapa !== 'standby');
  const cartera = polizasCartera();
  /* Persistencia: una póliza "terminada" (crédito pagado o vencida) no cuenta como pérdida; "cancelada" sí, sea o no de deudor */
  const todas = cs.flatMap(c => c.polizas || []).filter(p => p.estado !== 'terminada');
  const renovadas = todas.reduce((s, p) => s + (Number(p.renovaciones) || 0), 0);
  const canceladas = todas.filter(p => p.estado === 'cancelada').length;
  return {
    pipeline: sumarPorMoneda(pipeline, c => c.prima, c => c.moneda), nPipeline: pipeline.length,
    conservada: sumarPorMoneda(cartera, x => x.p.prima, x => x.p.moneda),
    riesgo: sumarPorMoneda(cartera.filter(({ p }) => cubeta(p) === 'gracia'), x => primaRecibo(x.p), x => x.p.moneda),
    renovadas, canceladas, persistencia: renovadas + canceladas ? Math.round(renovadas / (renovadas + canceladas) * 100) : null,
    n1: cs.filter(c => c.hitos?.cita1).length, n2: cs.filter(c => c.hitos?.cita2).length, n3: cs.filter(c => c.hitos?.cierre).length,
  };
}
function embudo(k) {
  const max = Math.max(k.n1, 1);
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  const filas = [['Cita 1ª realizada', k.n1, null], ['Cita 2ª realizada', k.n2, pct(k.n2, k.n1)], ['Póliza cerrada', k.n3, pct(k.n3, k.n2)]];
  return `<div class="flex flex-col gap-3">${filas.map(([n, v, r], i) => `
    <div><div class="flex items-baseline justify-between text-[13.5px] mb-1"><span class="text-ink2">${n}</span><span><span class="font-semibold">${v}</span>${r ? ` <span class="text-ink3 text-[12px]">· ${r} pasa</span>` : ''}</span></div>
    <div class="h-2.5 rounded-full bg-sunken overflow-hidden"><div class="bar h-full rounded-full ${i === 2 ? 'bg-ok' : 'bg-brand'}" style="width:${Math.max(4, v / max * 100)}%; animation-delay:${i * 90}ms"></div></div></div>`).join('')}
    <p class="text-[12.5px] text-ink2 mt-1">${k.n1 ? `De cada 10 primeras citas, <strong class="font-semibold">${Math.round(k.n3 / k.n1 * 10)}</strong> terminan en póliza.` : 'Registra asistencia a tus citas para ver tu conversión.'}</p></div>`;
}
function filaCobranza({ c, p }) {
  const dv = diasHasta(p.proxVencimiento), t = semaforo(p);

/* ---------- VENTAS (pipeline) ---------- */
function vistaVentas() {
  const lista = db.contactos.filter(c => c.etapa !== 'cancelada');

  return `
  ${encabezado('Pipeline de ventas', `${fSumaMonedas(total)} en prima anual por cerrar · arrastra las tarjetas para moverlas`, `<button class="btn-primary hidden sm:inline-flex" data-act="nuevo">${icon('plus', 'w-4 h-4')} Prospecto</button>`)}

      ${VENTAS.map(e => {
        const items = porEtapa(e.id);
        const suma = textosMoneda(sumarPorMoneda(e.id === 'emitida' ? [] : items, c => c.prima, c => c.moneda)).join(' · ');
        return `<section class="kcol ${ui.etapaMovil === e.id ? '' : 'hidden md:flex'}" data-drop="${e.id}" aria-label="${e.nombre}">
          <header class="px-1.5 pt-1 pb-1.5">
            <div class="flex items-center justify-between gap-2"><h2 class="font-sans! text-[14px] font-semibold">${e.nombre}</h2><span class="tag bg-surface text-ink2">${items.length}</span></div>
            <p class="text-[12px] text-ink3">${e.sub}${suma ? ` · ${suma}` : ''}</p>
          </header>
          ${items.length ? items.map(tarjetaVenta).join('') : `<p class="text-[12.5px] text-ink3 text-center py-6 px-3 border border-dashed border-line rounded-xl">${e.id === 'prospecto' ? 'Agrega a tu próximo prospecto con el botón +' : 'Suelta aquí una tarjeta'}</p>`}
        </section>`;
      }).join('')}
    </div>
  </div>`;
}
function tarjetaVenta(c) {
  const pc = proximaCita(c);
  const pend = (c.citas || []).some(x => x.status === 'noasistio');
  const reag = (c.citas || []).reduce((s, x) => s + (x.reagendas || 0), 0);
  return `<article class="kcard" draggable="true" data-drag="${c.id}" data-act="detalle" data-id="${c.id}" tabindex="0">
    <div class="flex items-start gap-2.5">${avatar(c, 'w-8 h-8 text-[11.5px]')}
      <div class="min-w-0 flex-1"><p class="font-medium text-[14px] leading-snug truncate">${esc(c.nombre)}</p><p class="text-[12px] text-ink3 truncate">${esc(c.ocupacion || estadoDe(c))}</p></div>
      ${prioridadTag(c.prioridad)}

  const totales = Object.fromEntries(INFORME.flatMap(g => g.filas).map(([k]) => [k, Math.round(dias.reduce((s, d) => s + valorDia(k, d), 0) * 10) / 10]));

    return v < 0 ? `<span class="text-bad font-semibold">${fNum(v, k)}</span>` : `<span class="text-ok font-semibold">${v > 0 ? '+' : ''}${fNum(v, k)}</span>`; };

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      ${claves.map(([k, n]) => { const meta = objetivo(k)[1], t = totales[k], pct = meta ? Math.min(100, Math.round(t / meta * 100)) : 0;
        return `<div class="min-w-0"><div class="flex items-baseline justify-between gap-2"><p class="text-[13.5px] text-ink2">${n}</p><p class="tabular-nums"><span class="font-display text-[22px]">${fNum(t, k)}</span><span class="text-ink3 text-[13px]"> / ${meta}</span></p></div>

    <div class="overflow-x-auto">
      <table class="w-full text-[13.5px] tabular-nums border-collapse min-w-[860px]">
        <thead>
          <tr class="bg-brand text-on-brand">
            <th class="sticky left-0 bg-brand text-left font-medium px-4 py-3 min-w-[220px]">Indicador</th>
            <th class="font-medium px-2 py-3 text-on-brand2" title="Objetivo por día">Obj. día</th>
            <th class="font-medium px-2 py-3 text-on-brand2" title="Objetivo de la semana">Obj. sem.</th>
            ${dias.map(d => `<th class="font-medium px-2 py-3 capitalize ${d === T ? 'bg-white/15' : ''}">${fFecha(d, { weekday: 'short' }).slice(0, 3)} ${parse(d).getDate()}</th>`).join('')}

          </tr>
        </thead>
        <tbody>
          ${INFORME.map(g => `<tr><td colspan="12" class="sticky left-0 bg-sunken px-4 py-1.5 label">${g.grupo}</td></tr>
            ${g.filas.map(([k, n]) => `<tr class="border-t border-line">
              <th scope="row" class="sticky left-0 bg-surface text-left font-normal px-4 py-2">${n}</th>
              <td class="text-center px-2 text-ink3">${objetivo(k)[0] || '–'}</td><td class="text-center px-2 text-ink3">${objetivo(k)[1] || '–'}</td>
              ${dias.map(d => { const v = valorDia(k, d), aj = ajusteDia(k, d);

</div>`;

/* ---------- CITAS ---------- */
function vistaCitas() {
  if (ui.citasModo === 'stats') return vistaEstadisticas();
  if (ui.citasModo === 'informe') return vistaInforme();
  const ini = ui.semana, fin = addDays(ini, 6), T = hoy();
  const filtro = ui.filtroCitas;
  const pasaFiltro = x => filtro === 'todas' || (filtro === 'ventas' ? ['cita1', 'cita2'].includes(x.tipo) : ['anual', 'posventa'].includes(x.tipo));
  const citas = todasCitas().filter(pasaFiltro);
  const semana = citas.filter(x => x.fecha >= ini && x.fecha <= fin).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  const pendientes = citas.filter(x => x.status === 'noasistio' || (x.status === 'programada' && x.fecha < T));
  const dias = Array.from({ length: 7 }, (_, i) => addDays(ini, i));
  const rango = `${fFecha(ini, { day: 'numeric', month: 'short' })} – ${fFecha(fin, { day: 'numeric', month: 'short', year: 'numeric' })}`;
  return `
  ${encabezado('Citas', (n => `${n} ${n === 1 ? 'programada' : 'programadas'} esta semana`)(semana.filter(x => x.status === 'programada').length), `<button class="btn-primary" data-act="cita">${icon('calendar-plus', 'w-4 h-4')} <span class="hidden sm:inline">Agendar cita</span><span class="sm:hidden">Agendar</span></button>`)}
  ${toggleCitas()}
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <div class="flex items-center gap-1 card px-1 py-1 rounded-xl!">
      <button class="btn-ghost btn-sm px-2!" data-act="semana" data-delta="-7" aria-label="Semana anterior">${icon('chevron-left', 'w-4 h-4')}</button>
      <p class="text-[14px] font-medium px-1 min-w-[150px] text-center">${rango}</p>
      <button class="btn-ghost btn-sm px-2!" data-act="semana" data-delta="7" aria-label="Semana siguiente">${icon('chevron-right', 'w-4 h-4')}</button>
    </div>
    ${ini !== lunesDe(T) ? `<button class="btn-ghost btn-sm" data-act="semana" data-delta="0">Hoy</button>` : ''}
    <div class="flex gap-2 scroll-x">${[['todas', 'Todas'], ['ventas', 'De venta'], ['posventa', 'Posventa']].map(([id, n]) => `<button class="chip" data-act="filtro-citas" data-f="${id}" aria-pressed="${filtro === id}">${n}</button>`).join('')}</div>
    <div class="flex items-center gap-2 text-[12px] text-ink3 w-full sm:w-auto sm:ml-auto">${tipoTag('cita1')}${tipoTag('cita2')}${tipoTag('anual')}<span>revisión o posventa</span></div>
  </div>

  ${pendientes.length ? `<section class="card p-4 mb-4 border-bad/30! fade-in" aria-labelledby="h-pend">
    <h2 id="h-pend" class="font-sans! text-[14px] font-semibold text-bad flex items-center gap-2 mb-2">${icon('calendar-x', 'w-4 h-4')} Por reagendar (${pendientes.length})</h2>
    <ul class="divide-y divide-line">${pendientes.map(x => filaCita(x, true)).join('')}</ul></section>` : ''}

  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3 stagger">
    ${dias.map(d => {
      const items = semana.filter(x => x.fecha === d);
      const esHoy = d === T;
      if (!items.length && !esHoy) return '';
      return `<section class="card p-4 min-w-0 ${esHoy ? 'ring-2 ring-brand/30' : ''}">
        <h2 class="font-sans! text-[13px] font-semibold uppercase tracking-[0.06em] ${esHoy ? 'text-brand' : 'text-ink3'} mb-1 capitalize">${esHoy ? 'Hoy · ' : ''}${fFecha(d, { weekday: 'long', day: 'numeric', month: 'short' })}</h2>
        ${items.length ? `<ul class="divide-y divide-line">${items.map(x => filaCita(x)).join('')}</ul>` : `<p class="text-[13px] text-ink3 py-2">Sin citas hoy.</p>`}
      </section>`;
    }).join('') || ''}
  </div>
  ${!semana.length ? `<div class="card p-8 text-center mt-3"><div class="icon-chip bg-brand-soft text-brand mx-auto mb-3">${icon('calendar-search', 'w-5 h-5')}</div><p class="font-display text-[20px]">Semana despejada</p><p class="text-[13.5px] text-ink2 mt-1 mb-4">No hay citas entre ${rango}.</p><button class="btn-primary" data-act="cita">${icon('calendar-plus', 'w-4 h-4')} Agendar cita</button></div>` : ''}`;
}
function estadoCitaTag(x) {
  const m = { programada: ['bg-brand-soft text-brand', 'Programada'], asistio: ['bg-ok-soft text-ok', 'Asistió'], noasistio: ['bg-bad-soft text-bad', 'No asistió'], cancelada: ['bg-sunken text-ink3', 'Cancelada'] };
  const [cls, t] = m[x.status] || m.programada;
  return `<span class="tag ${cls}">${t}</span>`;
}
function filaCita(x, pendiente = false) {
  return `<li class="py-3 flex flex-col gap-2">
    <button class="flex items-start gap-3 text-left" data-act="detalle" data-id="${x.contacto.id}">
      <div class="w-[68px] shrink-0"><p class="text-[13.5px] font-semibold whitespace-nowrap">${fHora(x.hora)}</p>${pendiente ? `<p class="text-[11.5px] text-ink3">${fFecha(x.fecha)}</p>` : ''}</div>

        <p class="text-[12.5px] text-ink2 truncate flex items-center gap-1.5">${tipoTag(x.tipo)}<span class="truncate">${x.objetivo ? esc(x.objetivo) : TIPOS_CITA[x.tipo]}</span></p>
        <p class="text-[12px] text-ink3 flex flex-wrap items-center gap-x-1.5 mt-0.5">${icon(x.modalidad === 'Virtual' ? 'video' : 'map-pin', 'w-3.5 h-3.5')} ${x.modalidad}${x.reagendas ? `<span class="text-warn whitespace-nowrap">· reagendada ${x.reagendas}×</span>` : ''}</p></div>
      ${estadoCitaTag(x)}
    </button>
    ${x.status === 'programada' || pendiente ? `<div class="flex gap-1.5 flex-wrap pl-[80px]">${x.link && x.status === 'programada' ? `<a class="btn-soft btn-sm" href="${esc(x.link)}" target="_blank" rel="noopener">${icon('video', 'w-4 h-4')} Entrar</a>` : ''}${pendiente ? `<button class="btn-primary btn-sm" data-act="reagendar" data-id="${x.contacto.id}" data-cita="${x.id}">${icon('calendar-clock', 'w-4 h-4')} Reagendar</button>` : botonesAsistencia(x.contacto.id, x.id)}</div>` : ''}
  </li>`;
}
function botonesAsistencia(cid, xid, sobreMarca = false) {
  const base = sobreMarca ? 'btn btn-sm bg-white/12 text-on-brand hover:bg-white/20' : 'btn-soft btn-sm';
  return `<button class="${sobreMarca ? 'btn btn-sm bg-on-brand text-brand' : 'btn-sm btn bg-ok-soft text-ok hover:bg-ok hover:text-white'}" data-act="asistio" data-id="${cid}" data-cita="${xid}">${icon('check', 'w-4 h-4')} Asistió</button>

}

/* Participación de cada aliado: por pólizas vigentes o por ventas del año (fecha de inicio de vigencia) */
function porAliado() {
  const anio = hoy().slice(0, 4);
  const todas = db.contactos.flatMap(c => (c.polizas || []).map(p => ({ c, p })));
  const base = ui.aliadosModo === 'anio'
    ? todas.filter(({ p }) => (p.inicioVigencia || '').startsWith(anio))
    : todas.filter(({ c, p }) => esCliente(c) && activa(p));
  const grupos = {};
  base.forEach(({ p }) => { const a = p.aseguradora || 'Sin aliado'; (grupos[a] = grupos[a] || []).push(p); });
  const filas = Object.entries(grupos).map(([a, ps]) => ({ a, n: ps.length, primas: textosMoneda(sumarPorMoneda(ps, p => p.prima, p => p.moneda)) })).sort((x, y) => y.n - x.n);
  const total = base.length;
  const lider = filas[0];
  return `<section class="card p-5 mb-4" aria-labelledby="h-aliados">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <h2 id="h-aliados" class="text-[20px]">Por aliado</h2>
      <div class="flex gap-1 card p-1 rounded-xl!">${[['cartera', 'Cartera vigente'], ['anio', `Ventas ${anio}`]].map(([id, n]) => `<button class="chip border-0! min-h-8! ${ui.aliadosModo === id ? '' : 'bg-transparent!'}" data-act="aliados-modo" data-m="${id}" aria-pressed="${ui.aliadosModo === id}">${n}</button>`).join('')}</div>
    </div>
    ${!total ? `<p class="text-[13.5px] text-ink3">${ui.aliadosModo === 'anio' ? `Aún no hay pólizas con inicio de vigencia en ${anio}.` : 'Aún no tienes pólizas vigentes.'}</p>` : `
    <ul class="flex flex-col gap-3">${filas.map(f => { const pct = Math.round(f.n / total * 100);
      return `<li><div class="flex items-baseline justify-between gap-3 text-[14px]"><span class="font-medium">${esc(f.a)}</span><span class="tabular-nums"><span class="font-semibold">${pct}%</span><span class="text-ink3 text-[12.5px]"> · ${f.n} ${f.n === 1 ? 'póliza' : 'pólizas'}</span></span></div>
        <div class="h-2.5 rounded-full bg-sunken overflow-hidden mt-1"><div class="bar h-full rounded-full bg-brand" style="width:${Math.max(3, pct)}%"></div></div>
        <p class="text-[12px] text-ink3 mt-1 tabular-nums">${f.primas.length ? f.primas.join(' · ') + ' en prima anual' : 'Sin prima registrada'}</p></li>`; }).join('')}</ul>

/* Estado de prospección (como el "Status HDN"): cada prospecto según sus llamadas registradas */
function estadoLlamadas(c) {
  if (c.rechazoEn) return 'rechazo';
  const ll = c.llamadas || [];
  if (ll.some(l => l.resultado === 'efectivo')) return 'efectivo';
  return ll.length ? 'intento' : 'pendiente';
}
const universoProspeccion = c => !esCliente(c) && (c.etapa !== 'cancelada' || c.rechazoEn);
function estadoProspeccion() {
  const ps = db.contactos.filter(universoProspeccion);
  const n = k => ps.filter(c => estadoLlamadas(c) === k).length;
  const cajas = [['efectivo', 'Efectivos', 'ya hablaron', 'phone-call', 'bg-ok-soft text-ok'], ['intento', 'Intentos', 'sin respuesta', 'phone-missed', 'bg-warn-soft text-warn'],

/* ---------- CONTACTOS ---------- */
const FILTROS = [
  ['todos', 'Todos'], ['prospectos', 'Prospectos'], ['clientes', 'Clientes'], ['alta', 'Prioridad alta'],
  ['vencidas', 'Prima vencida este mes'], ['renov30', 'Renovaciones 30 días'], ['citaspos', 'Citas posventa'], ['sinllamar', 'Sin llamar'], ['rechazos', 'No les interesa'], ['inactivos', 'En pausa / canceladas'],
];
function aplicaFiltro(c, f) {
  switch (f) {
    case 'prospectos': return enVentas(c) && c.etapa !== 'standby';
    case 'clientes': return esCliente(c);
    case 'alta': return c.prioridad === 'Alta';
    case 'vencidas': return esCliente(c) && vigentes(c).some(p => cubeta(p) === 'gracia');
    case 'renov30': return esCliente(c) && vigentes(c).some(p => p.inicioVigencia && diasHasta(proximoAniversario(p.inicioVigencia)) <= 30);
    case 'citaspos': return (c.citas || []).some(x => ['anual', 'posventa'].includes(x.tipo) && x.status === 'programada');
    case 'sinllamar': return universoProspeccion(c) && estadoLlamadas(c) === 'pendiente';
    case 'rechazos': return !!c.rechazoEn && !esCliente(c);
    case 'efectivos': return universoProspeccion(c) && estadoLlamadas(c) === 'efectivo';
    case 'intentos': return universoProspeccion(c) && estadoLlamadas(c) === 'intento';
    case 'inactivos': return ['standby', 'cancelada'].includes(c.etapa);
    default: return true;
  }
}

        <div class="flex shrink-0 -mr-1"><button class="grid place-items-center w-9 h-9 rounded-lg text-ink3 hover:bg-sunken hover:text-ink" data-act="nota" data-id="${c.id}" data-nota="${n.id}" aria-label="Editar nota" title="Editar">${icon('pencil', 'w-4 h-4')}</button>
        <button class="grid place-items-center w-9 h-9 rounded-lg text-ink3 hover:bg-bad-soft hover:text-bad" data-act="borrar-nota" data-id="${c.id}" data-nota="${n.id}" aria-label="Borrar nota" title="Borrar">${icon('trash-2', 'w-4 h-4')}</button></div></div></li>`).join('')}</ol>`
      : `<p class="text-[13px] text-ink3 py-1">Anota aquí cada llamada, acuerdo o detalle personal. Tu yo del próximo año te lo agradecerá.</p>`}
    </section>

    <section class="card p-4">
      <div class="flex items-center justify-between mb-2"><h3 class="text-[17px]">Datos personales</h3><button class="btn-ghost btn-sm" data-act="editar" data-id="${c.id}">${icon('pencil', 'w-4 h-4')} Editar</button></div>

  if (refrescar && document.querySelector('#modal-root [role=dialog]')) {
    const panel = document.querySelector('#modal-root .sheet'); const top = panel.scrollTop;

  } else abrirModal(html, { lateral: true });
}

/* ---------- Registrar pago ---------- */
function abrirPago(cid, pid) {
  const c = getC(cid), p = c.polizas.find(x => x.id === pid);
  if (!p.inicioVigencia || !p.proxVencimiento) { abrirFormPoliza(cid, pid, 'Completa el inicio de vigencia y el próximo recibo para poder registrar pagos.'); return; }
  const nuevo = siguienteRecibo(p.inicioVigencia, p.formaPago, p.proxVencimiento);
  const meses = mesesEntre(p.inicioVigencia, p.proxVencimiento);
  const esAniv = meses > 0 && meses % 12 === 0;
  /* Si el recibo aún está lejos, casi siempre es un pago repetido: se avisa antes de confirmar */
  const faltan = diasHasta(p.proxVencimiento);
  const ultimo = [...(p.pagos || [])].sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
  const adelantado = faltan > 45;
  abrirModal(`
  ${cabeceraModal('Registrar pago', `${esc(c.nombre)} · ${esc([p.plan || p.ramo, p.numero].filter(Boolean).join(' · '))}`)}
  <form data-form="pago" data-id="${cid}" data-pol="${pid}" class="px-5 py-4 flex flex-col gap-3" novalidate>

/* Una fila por póliza. Las filas del mismo cliente (misma cédula o mismo nombre) se agrupan en un solo contacto */
const COLUMNAS_CARTERA = [
  ['cedula', 'Cédula', ['cedula', 'idcliente', 'idclientecc', 'cc', 'documento']],
  ['nombre', 'Nombre completo', ['nombrecompleto', 'nombre', 'nombres', 'cliente']],
  ['apellido1', 'Primer apellido', ['primerapellido']],
  ['apellido2', 'Segundo apellido', ['segundoapellido']],
  ['nacimiento', 'Fecha de nacimiento', ['fechadenacimiento', 'fechanacimiento', 'nacimiento']],
  ['telefono', 'Celular', ['celular', 'telefono', 'movil']],
  ['whatsapp', 'WhatsApp', ['whatsapp']],
  ['email', 'Email', ['email', 'correo', 'correoelectronico']],
  ['ciudad', 'Ciudad', ['ciudad']],
  ['ocupacion', 'Profesión', ['profesion', 'ocupacion']],
  ['civil', 'Estado civil', ['estadocivil']],
  ['hijos', 'Hijos', ['hijos']],
  ['edadesHijos', 'Edades de los hijos', ['edadeshijos', 'edadesdeloshijos']],
  ['ingresos', 'Ingresos mensuales', ['ingresosmensuales', 'ingresosmes', 'ingresos']],
  ['objetivo', 'Objetivo principal', ['objetivoprincipal', 'objetivo']],
  ['numero', 'Número de póliza', ['numerodepoliza', 'nodepoliza', 'nopoliza', 'poliza']],
  ['aseguradora', 'Aseguradora', ['aseguradora', 'compania']],
  ['plan', 'Tipo de plan', ['tipodeplan', 'plan', 'producto']],
  ['capa', 'Capa estratégica', ['capaestrategica', 'capa']],
  ['ramo', 'Ramo', ['ramo']],
  ['cobertura', 'Cobertura', ['cobertura']],
  ['estadoPoliza', 'Estado', ['estado', 'estadodelapoliza']],
  ['moneda', 'Moneda', ['moneda']],
  ['suma', 'Suma asegurada', ['sumaasegurada']],
  ['prima', 'Prima anual', ['primaanual', 'prima']],
  ['formaPago', 'Forma de pago', ['formadepago']],
  ['inicioVigencia', 'Fecha inicio', ['fechainicio', 'fechadeinicio', 'iniciodevigencia', 'inicio']],
  ['proxVencimiento', 'Próximo recibo', ['proximorecibo', 'proximovencimiento']],
  ['anioPoliza', 'Año póliza', ['anopoliza', 'aniopoliza']],
  ['potencial', 'Potencial estratégico', ['potencialestrategico', 'potencial']],
  ['prioridad', 'Prioridad', ['prioridad']],
  ['comoLlego', 'Cómo llegó', ['comollego', 'origen']],
  ['referidoPor', 'Referido por', ['referidopor']],
  ['ultimoContacto', 'Último contacto', ['ultimocontacto']],
  ['proximaAccion', 'Próxima acción', ['proximaaccion']],
  ['notas', 'Notas', ['notas', 'observaciones']],
];
const CAPA_A_RAMO = { proteccion: 'Vida', patrimonio: 'Ahorro/Inversión', liquidez: 'Ahorro/Inversión', retiro: 'Retiro', salud: 'Gastos Médicos' };
const normal = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
function leerCSV(texto) {
  texto = texto.replace(/^﻿/, '');
  const primera = texto.split(/\r?\n/)[0];
  const sep = (primera.match(/;/g) || []).length >= (primera.match(/,/g) || []).length ? ';' : ',';
  const filas = []; let fila = [], celda = '', comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (comillas) { if (ch === '"') { if (texto[i + 1] === '"') { celda += '"'; i++; } else comillas = false; } else celda += ch; }
    else if (ch === '"') comillas = true;
    else if (ch === sep) { fila.push(celda); celda = ''; }
    else if (ch === '\n') { fila.push(celda); filas.push(fila); fila = []; celda = ''; }
    else if (ch !== '\r') celda += ch;
  }
  if (celda || fila.length) { fila.push(celda); filas.push(fila); }
  return filas;
}
function leerFecha(v) {
  if (typeof v === 'number' && v > 1000 && v < 100000) { const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  v = String(v ?? '').trim(); if (!v) return '';
  let m = v.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = v.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  return '';
}
function leerMonto(v) {
  if (typeof v === 'number') return v;
  let t = String(v ?? '').replace(/[^\d.,-]/g, ''); if (!t) return 0;
  const p = t.lastIndexOf('.'), c = t.lastIndexOf(',');
  if (p > -1 && c > -1) t = p > c ? t.replace(/,/g, '') : t.replace(/\./g, '').replace(',', '.');
  else { const s = p > -1 ? '.' : c > -1 ? ',' : null;
    if (s) { const partes = t.split(s); t = partes.length > 2 || partes[partes.length - 1].length === 3 ? partes.join('') : partes.join('.'); } }
  return Number(t) || 0;
}
const elegir = (v, lista, defecto) => { const n = normal(v); return lista.find(x => normal(x) === n) || lista.find(x => n && normal(x).startsWith(n.slice(0, 4))) || defecto; };

function cargarLectorExcel() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, falla) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = ok; s.onerror = falla; document.head.appendChild(s);
  });
}
/* De un libro de Excel toma la hoja que tenga encabezado con "Nombre" y más filas de datos */
function filasDeExcel(buffer) {
  const libro = XLSX.read(buffer, { type: 'array' });
  let mejor = null;
  libro.SheetNames.forEach(n => {
    const filas = XLSX.utils.sheet_to_json(libro.Sheets[n], { header: 1, raw: true, defval: '' });
    const i = buscarEncabezado(filas);
    if (i < 0) return;
    const cab = filas[i].map(normal);
    const columnas = COLUMNAS_CARTERA.filter(c => cab.some(h => c[2].includes(h))).length;
    const iNombre = cab.findIndex(h => COLUMNAS_CARTERA[1][2].includes(h));
    const puntaje = columnas * filas.slice(i + 1).filter(f => String(f[iNombre] ?? '').trim()).length;
    if (!mejor || puntaje > mejor.puntaje) mejor = { filas: filas.slice(i), puntaje };
  });
  return mejor ? mejor.filas : [];
}
function buscarEncabezado(filas) {
  const alias = COLUMNAS_CARTERA.find(c => c[0] === 'nombre')[2];
  return filas.slice(0, 20).findIndex(f => f.some(v => alias.includes(normal(v))));
}

function contactosDesdeFilas(filas) {
  const i0 = buscarEncabezado(filas);
  if (i0 < 0) return { error: 'No encontré una columna de nombre ("Nombre completo"). Revisa el archivo o usa la plantilla.' };
  const cab = filas[i0].map(normal);
  const idx = Object.fromEntries(COLUMNAS_CARTERA.map(([k, , alias]) => [k, cab.findIndex(h => alias.includes(h))]));
  const val = (f, k) => idx[k] >= 0 ? f[idx[k]] : '';
  const txt = (f, k) => String(val(f, k) ?? '').trim();
  const grupos = new Map();
  filas.slice(i0 + 1).forEach(f => {
    const nombre = [txt(f, 'nombre'), txt(f, 'apellido1'), txt(f, 'apellido2')].filter(Boolean).join(' ').replace(/\s+/g, ' ');
    if (!nombre) return;
    const cedula = soloDigitos(txt(f, 'cedula'));
    const clave = cedula || normal(nombre);
    if (!grupos.has(clave)) {
      const nacimiento = leerFecha(val(f, 'nacimiento'));
      const estrellas = (txt(f, 'potencial').match(/⭐/g) || []).length || Number(txt(f, 'potencial')) || 0;
      grupos.set(clave, {
        id: uid(), nombre, cedula, nacimiento, telefono: txt(f, 'telefono'), whatsapp: txt(f, 'whatsapp') || txt(f, 'telefono'), email: txt(f, 'email'),
        ciudad: txt(f, 'ciudad'), ocupacion: txt(f, 'ocupacion'), edad: rangoEdad(edadDe(nacimiento)), civil: elegir(txt(f, 'civil'), CIVILES, 'Soltero(a)'),
        hijos: Number(txt(f, 'hijos')) || 0, edadesHijos: txt(f, 'edadesHijos'), ingresos: leerMonto(val(f, 'ingresos')), objetivo: txt(f, 'objetivo'), comoLlego: txt(f, 'comoLlego'), referidoPor: txt(f, 'referidoPor'),
        prioridad: estrellas ? (estrellas >= 4 ? 'Alta' : estrellas === 3 ? 'Media' : 'Baja') : elegir(txt(f, 'prioridad'), PRIORIDADES, 'Media'),
        ramo: 'Vida', prima: 0, moneda: 'COP', etapa: 'prospecto', estado: 'Prospecto Frío', fueCliente: false, hitos: {}, notas: [], citas: [], polizas: [], creado: hoy(),
      });
    }
    const c = grupos.get(clave);
    const fechaNota = leerFecha(val(f, 'ultimoContacto')) || hoy();
    [txt(f, 'notas'), txt(f, 'proximaAccion') && `Próxima acción: ${txt(f, 'proximaAccion')}`].filter(Boolean).forEach(texto => {
      if (!c.notas.some(n => n.texto === texto)) c.notas.push({ id: uid(), fecha: fechaNota, hora: '', texto });
    });
    const numero = txt(f, 'numero'), inicioVigencia = leerFecha(val(f, 'inicioVigencia'));
    if (!numero && !inicioVigencia) return;
    const capa = elegir(txt(f, 'capa'), CAPAS, '');
    const ramoTxt = txt(f, 'ramo');
    const ramo = ramoTxt ? elegir(ramoTxt, RAMOS, 'Vida')
      : /dano|terremoto|hogar/.test(normal(txt(f, 'cobertura') + txt(f, 'plan'))) ? 'Hogar' : CAPA_A_RAMO[normal(capa)] || 'Vida';
    const formaPago = elegir(txt(f, 'formaPago'), Object.keys(FORMAS), 'Anual');
    const anio = Number(txt(f, 'anioPoliza')) || 0;
    const aseg = txt(f, 'aseguradora');
    c.polizas.push(nuevaPoliza({
      numero, aseguradora: elegir(aseg, ALIADAS, aseg), plan: txt(f, 'plan'), capa, ramo, formaPago, inicioVigencia,
      proxVencimiento: leerFecha(val(f, 'proxVencimiento')) || (inicioVigencia ? reciboVigente(inicioVigencia, formaPago) : ''),
      prima: leerMonto(val(f, 'prima')), moneda: /us|dol/i.test(txt(f, 'moneda')) ? 'USD' : 'COP', sumaAsegurada: leerMonto(val(f, 'suma')),
      estado: /termin|pagad/i.test(txt(f, 'estadoPoliza')) ? 'terminada' : /cancel|anul|caduc/i.test(txt(f, 'estadoPoliza')) ? 'cancelada' : 'vigente', renovaciones: anio > 1 ? anio - 1 : 0,
      deudor: /endoso|deudor/i.test(txt(f, 'plan')) || /credito/.test(normal(txt(f, 'objetivo'))),
    }));
  });
  const lista = [...grupos.values()];
  lista.forEach(c => {
    if (c.polizas.length) {
      c.fueCliente = true;
      c.etapa = vigentes(c).length ? 'emitida' : 'cancelada';
      c.estado = c.etapa === 'emitida' ? 'Cliente Activo' : 'Cancelada';
      c.ramo = (vigentes(c)[0] || c.polizas[0]).ramo;
    }
  });
  return { lista };
}

async function importarCartera(filas) {
  const { lista, error } = contactosDesdeFilas(filas);
  if (error) { toast(error, { tono: 'bad' }); return; }
  if (!lista.length) { toast('No encontré clientes con nombre en el archivo.', { tono: 'bad' }); return; }
  const reales = db.contactos.filter(c => !(db.esDemo && c.demo));
  const existente = n => reales.find(c => (n.cedula && soloDigitos(c.cedula) === n.cedula) || normal(c.nombre) === normal(n.nombre));
  const nPol = lista.reduce((s, c) => s + c.polizas.length, 0);
  const nVig = lista.reduce((s, c) => s + vigentes(c).length, 0);
  const nAct = lista.filter(existente).length;
  const msg = `Encontré ${lista.length} clientes con ${nPol} pólizas (${nVig} vigentes${nPol - nVig ? `, ${nPol - nVig} canceladas` : ''}).`
    + (nAct ? `\n${lista.length - nAct} son nuevos y ${nAct} ya estaban: a esos les actualizo los datos sin borrar lo que ya registraste.` : '')
    + (db.esDemo ? '\n\nTambién quitaré los contactos de ejemplo.' : '') + '\n\n¿Continuar?';
  if (!(await confirmar(msg, { si: 'Cargar cartera' }))) return;
  foto();
  if (db.esDemo) { db.contactos = db.contactos.filter(c => !c.demo); db.esDemo = false; }
  lista.forEach(n => {
    const c = existente(n);
    if (!c) { db.contactos.push(n); return; }
    ['cedula', 'nacimiento', 'telefono', 'whatsapp', 'email', 'ciudad', 'ocupacion', 'objetivo', 'comoLlego', 'referidoPor', 'edadesHijos', 'ingresos'].forEach(k => { if (n[k]) c[k] = n[k]; });
    c.polizas = c.polizas || [];
    n.polizas.forEach(np => {
      const p = c.polizas.find(x => np.numero && normal(x.numero) === normal(np.numero));
      if (!p) { c.polizas.push(np); return; }
      ['aseguradora', 'plan', 'capa', 'ramo', 'formaPago', 'inicioVigencia', 'prima', 'moneda', 'sumaAsegurada', 'estado', 'deudor'].forEach(k => { if (np[k] !== '' && np[k] != null) p[k] = np[k]; });
    });
    n.notas.forEach(nt => { if (!c.notas.some(x => x.texto === nt.texto)) c.notas.push(nt); });
    if (vigentes(c).length && !esCliente(c)) { c.etapa = 'emitida'; c.estado = 'Cliente Activo'; c.fueCliente = true; }
  });
  guardar(); cerrarModal(); location.hash = 'posventa'; render();
  toast(`Cartera cargada: ${lista.length} clientes, ${nPol} pólizas`, { deshacer: true });
}

function moverEtapa(c, etapa) {
  if (c.etapa === etapa) return;
  if (etapa === 'emitida') {
    if (!vigentes(c).length) {
      abrirFormPoliza(c.id, null, 'Para pasar a posventa registra la póliza emitida.');
      return 'pendiente';
    }
    c.hitos = { ...c.hitos, cierre: c.hitos?.cierre || hoy() };
    c.fueCliente = true;
    c.estado = 'Cliente Activo';
  } else if (etapa === 'standby') c.estado = 'En pausa';
  else if (etapa === 'cancelada') { c.estado = 'Cancelada'; vigentes(c).forEach(p => (p.estado = 'cancelada')); }
  else {
    const mapa = { prospecto: c.estado === 'Contactado' ? 'Contactado' : 'Prospecto Frío', cita1: 'Cita 1 Agendada', propuesta: 'Cita 1 Realizada', cita2: 'Cita 2 Agendada', tramite: 'Radicada (en estudio)' };
    c.estado = mapa[etapa];
  }
  if (etapa !== 'cancelada') c.rechazoEn = null;
  c.etapa = etapa;
}

/* ---------- Delegación de eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    const cub = e.target.closest('[data-cubeta]');
    if (cub && cub.tagName === 'A') ui.cubetaMovil = cub.dataset.cubeta;
    return;
  }
  if (el.tagName === 'A' && el.getAttribute('href')?.startsWith('http')) return;
  const fn = acciones[el.dataset.act];
  if (!fn) return;
  e.preventDefault(); e.stopPropagation();
  fn(el.dataset, el);
});
document.addEventListener('keydown', e => {
  const conf = document.getElementById('confirm-root');
  if (e.key === 'Escape' && conf.cancelar && conf.firstChild) { conf.cancelar(); return; }
  if (e.key === 'Escape' && document.querySelector('#modal-root [role=dialog]')) acciones.cerrar();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('article[data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const btn = f.querySelector('button:not([type=button])');
  if (btn?.disabled) return;
  if (btn) { btn.disabled = true; setTimeout(() => (btn.disabled = false), 600); }
  formularios[f.dataset.form](f, new FormData(f));
});
document.addEventListener('change', e => {
  if (e.target.name === 'formaPago' && e.target.form?.dataset.form === 'poliza') sincronizarPrima(e.target.form, 'anual');
  if (e.target.name === 'moneda') refrescarVistaPrima(e.target.form);
  const el = e.target.closest('[data-change]'); if (!el) return;
  if (el.dataset.change === 'etapa') {
    foto(); const c = getC(el.dataset.id);
    const r = moverEtapa(c, el.value);
    if (r === 'pendiente') return;
    guardar(); render(); abrirDetalle(c.id, true); toast(`Movido a ${el.selectedOptions[0].text}`, { deshacer: true });
  }
  if (el.dataset.change === 'estado') { foto(); const c = getC(el.dataset.id); c.estado = el.value; guardar(); render(); abrirDetalle(c.id, true); toast('Estado actualizado', { deshacer: true }); }
  if (el.dataset.change === 'aseg') { const f = el.closest('form'); const otra = f.querySelector('[data-otra]'); otra.classList.toggle('hidden', el.value !== 'Otra'); if (el.value === 'Otra') f.aseguradoraOtra.focus(); }
  if (el.dataset.change === 'cartera') {
    const file = el.files[0]; el.value = ''; if (!file) return;
    const esExcel = /\.xlsx?$/i.test(file.name);
    (esExcel ? cargarLectorExcel().then(() => file.arrayBuffer()).then(b => filasDeExcel(new Uint8Array(b))) : file.text().then(leerCSV))
      .then(importarCartera)
      .catch(() => toast(esExcel ? 'No pude abrir ese Excel. Revisa tu conexión a internet e inténtalo de nuevo.' : 'No pude leer ese archivo.', { tono: 'bad' }));
  }
  if (el.dataset.change === 'importar') {
    const file = el.files[0]; if (!file) return;
    file.text().then(async t => {
      const d = JSON.parse(t);
      if (!d || !Array.isArray(d.contactos)) throw new Error('formato');
      if (!(await confirmar(`Este respaldo tiene ${d.contactos.length} contactos y reemplazará lo que ves ahora. ¿Continuar?`, { si: 'Cargar respaldo' }))) return;
      foto(); db = d; db.ajustes = db.ajustes || { usd: TASA_USD_INICIAL }; db.contactos.forEach(aFormatoPolizas); db.version = 3; db.objetivos = db.objetivos || { ...OBJETIVOS_BASE }; db.actividad = db.actividad || {}; guardar(); cerrarModal(); render(); toast('Respaldo cargado', { deshacer: true });
    }).catch(() => toast('Ese archivo no es un respaldo de Lirios CRM.', { tono: 'bad' }));
  }
});
/* Muestra la prima escrita con formato de moneda para evitar ceros de más o de menos */
const vistaPrima = (v, moneda) => Number(v) ? `= <strong class="font-semibold">${fDinero(Number(v), moneda)}</strong> al año` : 'Escribe el valor completo, sin puntos ni signo $. Ej.: 360000';
function refrescarVistaPrima(f) {
  const el = f && f.querySelector('[data-vista-prima]');
  if (el) el.innerHTML = vistaPrima(f.prima.value, f.moneda.value);
}
/* En el formulario de póliza, prima anual y valor de cada recibo se calculan entre sí */
function sincronizarPrima(f, origen) {
  const periodos = 12 / (FORMAS[f.formaPago.value] || 12);
  const r2 = v => Math.round(v * 100) / 100;
  if (origen === 'recibo') f.prima.value = f.recibo.value === '' ? '' : r2(Number(f.recibo.value) * periodos);
  else f.recibo.value = f.prima.value === '' ? '' : r2(Number(f.prima.value) / periodos);
  const et = f.querySelector('[data-recibo-etiqueta]'); if (et) et.textContent = `(${f.formaPago.value.toLowerCase()})`;
}
document.addEventListener('input', e => {
  if (e.target.dataset.prima) sincronizarPrima(e.target.form, e.target.dataset.prima);
  if (['prima', 'recibo'].includes(e.target.name)) refrescarVistaPrima(e.target.form);
  if (e.target.id === 'buscador-clientes') {
    ui.busquedaClientes = e.target.value;
    document.getElementById('lista-clientes').innerHTML = listaClientes();
    pintarIconos();
  }
  if (e.target.id === 'buscador') {
    ui.busqueda = e.target.value;
    const q = ui.busqueda.trim().toLowerCase();
    const lista = db.contactos.filter(c => aplicaFiltro(c, ui.filtro)).filter(c => !q || textoBusqueda(c).includes(q)).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    document.getElementById('lista-contactos').innerHTML = listaContactos(lista);
    pintarIconos();
  }
  const err = e.target.closest('.field')?.querySelector('[data-err]');
  if (err) err.classList.add('hidden');
});

/* Arrastrar y soltar en el pipeline (computadora) */
document.addEventListener('dragstart', e => { const card = e.target.closest('[data-drag]'); if (card) { e.dataTransfer.setData('text/plain', card.dataset.drag); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const col = e.target.closest('[data-drop]'); if (col) { e.preventDefault(); document.querySelectorAll('.drop-target').forEach(x => x !== col && x.classList.remove('drop-target')); col.classList.add('drop-target'); } });
document.addEventListener('dragleave', e => { const col = e.target.closest('[data-drop]'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('drop-target'); });
document.addEventListener('drop', e => {
  const col = e.target.closest('[data-drop]'); if (!col) return;
  e.preventDefault(); col.classList.remove('drop-target');
  const c = getC(e.dataTransfer.getData('text/plain')); if (!c || c.etapa === col.dataset.drop) return;
  foto();
  const r = moverEtapa(c, col.dataset.drop);
  if (r === 'pendiente') return;
  guardar(); render();
  toast(`${c.nombre.split(' ')[0]} → ${VENTAS.find(v => v.id === col.dataset.drop).nombre}`, { deshacer: true });
});

window.addEventListener('hashchange', () => { ui.vista = location.hash.slice(1) || 'hoy'; cerrarModal(); render(); window.scrollTo(0, 0); });
window.addEventListener('storage', e => { if (e.key === STORAGE_KEY && e.newValue) { db = JSON.parse(e.newValue); render(); } });

render();
conectarNube();
</script>
</body>
</html>

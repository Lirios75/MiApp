<style type="text/tailwindcss">
  @theme {
    --font-display: "Fraunces", Georgia, serif;
    --font-sans: "Poppins", ui-sans-serif, sans-serif;
    --color-bg: #F5F1E8;
    --color-surface: #FBF8F1;
    --color-sunken: #ECE6D8;
    --color-line: #E2DACA;
    --color-ink: #3C3428;
    --color-ink2: #5C5442;
    --color-ink3: #857A66;
    --color-brand: #3A6478;
    --color-brand-deep: #2E5162;
    --color-brand-soft: #DCE7EC;
    --color-on-brand: #E8EFF2;
    --color-on-brand2: #BBD0DA;
    --color-ok: #4C7A57;
    --color-ok-soft: #E1EBDD;
    --color-warn: #A86A12;
    --color-warn-soft: #F6E7C8;
    --color-bad: #A3453A;
    --color-bad-soft: #F3DCD6;
  }
  @layer base {
    html { -webkit-tap-highlight-color: transparent; }
    body { @apply bg-bg text-ink font-sans antialiased; font-size: 15px; }
    h1, h2, h3, .font-display { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.01em; }
    :focus-visible { outline: 2px solid var(--color-brand); outline-offset: 2px; }
    input, select, textarea { font: inherit; color: inherit; }
  }
  @layer components {
    .card, .kcard { @apply bg-surface rounded-2xl border border-line; box-shadow: 0 1px 0 rgba(60,52,40,.04), 0 6px 18px -10px rgba(60,52,40,.18); }
    .btn, .btn-primary, .btn-ghost, .btn-soft { @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 min-h-11 text-sm font-medium transition active:scale-[.97] disabled:opacity-50 cursor-pointer select-none; }
    .btn-primary { @apply bg-brand text-on-brand hover:bg-brand-deep; }
    .btn-ghost { @apply bg-transparent text-ink2 hover:bg-sunken; }
    .btn-soft { @apply bg-sunken text-ink hover:bg-line; }
    .btn-sm { @apply min-h-9 px-3 text-[13px] rounded-lg; }
    .chip { @apply inline-flex items-center gap-1.5 rounded-full px-3 min-h-9 text-[13px] font-medium border border-line bg-surface text-ink2 whitespace-nowrap cursor-pointer transition; }
    .chip[aria-pressed="true"] { @apply bg-brand text-on-brand border-brand; }
    .tag { @apply inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11.5px] font-medium whitespace-nowrap; }
    .field { @apply flex flex-col gap-1.5 min-w-0; }
    .field > span { @apply text-[12.5px] font-medium text-ink2; }
    .input { @apply w-full rounded-xl border border-line bg-bg px-3 min-h-11 text-[15px] outline-none transition focus:border-brand focus:bg-surface; }
    textarea.input { @apply py-2.5 min-h-24; }
    .label { @apply text-[12px] font-medium text-ink3 uppercase tracking-[0.06em]; }
    .icon-chip { @apply grid place-items-center w-10 h-10 rounded-xl shrink-0; }
    .navlink { @apply flex items-center gap-3 rounded-xl px-3 min-h-11 text-[14.5px] text-on-brand2 hover:bg-white/10 transition; }
    .navlink[aria-current="page"] { @apply bg-on-brand text-brand font-medium; }
    .tabbtn { @apply flex flex-col items-center justify-center gap-0.5 text-[11px] text-ink3 min-h-14 flex-1; }
    .tabbtn[aria-current="page"] { @apply text-brand font-medium; }
    .tabbtn[aria-current="page"] .tabdot { @apply bg-brand-soft; }
    .tabdot { @apply grid place-items-center w-12 h-7 rounded-full transition; }
    .kcol { @apply min-w-0 rounded-2xl bg-sunken/70 p-2.5 flex flex-col gap-2 min-h-40; }
    .kcard { @apply p-3 cursor-pointer hover:border-brand/40 transition; }
    .dot { @apply inline-block w-2 h-2 rounded-full shrink-0; }
  }
  .fade-in { animation: fadeIn .28s cubic-bezier(.2,.7,.2,1) both; }
  .stagger > * { animation: fadeIn .32s cubic-bezier(.2,.7,.2,1) both; }
  .stagger > *:nth-child(2) { animation-delay: 50ms } .stagger > *:nth-child(3) { animation-delay: 100ms }
  .stagger > *:nth-child(4) { animation-delay: 150ms } .stagger > *:nth-child(5) { animation-delay: 200ms }
  .stagger > *:nth-child(n+6) { animation-delay: 250ms }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .sheet { animation: sheetIn .26s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
  .bg-depth { background: radial-gradient(1200px 500px at 85% -10%, #E9EEEA 0%, transparent 60%), radial-gradient(900px 400px at -10% 110%, #EFE6D3 0%, transparent 60%), var(--color-bg); }
  .scroll-x { overflow-x: auto; scrollbar-width: none; } .scroll-x::-webkit-scrollbar { display: none; }
  .bar { transform-origin: left; animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  .drop-target { outline: 2px dashed var(--color-brand); outline-offset: -2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  [data-lucide] { width: 1em; height: 1em; }
  svg.lucide { stroke-width: 1.8; }
</style>

<script>
/* =========================================================
   Lirios CRM — un solo archivo, guarda todo en este navegador
   ========================================================= */
const STORAGE_KEY = 'lirios-crm-v1';

/* ---------- Catálogos ---------- */
const VENTAS = [
  { id: 'prospecto', nombre: 'Por llamar', sub: 'Prospectos' },
  { id: 'cita1', nombre: 'Cita 1ª', sub: 'Descubrimiento' },
  { id: 'propuesta', nombre: 'Propuesta', sub: 'Elaboración / estudio' },
  { id: 'cita2', nombre: 'Cita 2ª', sub: 'Presentación y cierre' },
  { id: 'tramite', nombre: 'En trámite', sub: 'Emisión' },
  { id: 'emitida', nombre: 'Póliza emitida', sub: 'Pasa a posventa' },
  { id: 'standby', nombre: 'Standby', sub: 'Reagendar a futuro' },
];
const POSVENTA = [
  { id: 'activa', nombre: 'Pólizas activas', sub: 'Vigentes y al día', tono: 'ok' },
  { id: 'renovacion', nombre: 'Renovación próxima', sub: 'Aniversario en ≤ 60 días', tono: 'warn' },
  { id: 'pago', nombre: 'Alerta de pago', sub: 'Recibo en ≤ 15 días', tono: 'warn' },
  { id: 'gracia', nombre: 'Periodo de gracia', sub: 'Recibo vencido', tono: 'bad' },
  { id: 'conservada', nombre: 'Conservada / renovada', sub: 'Ciclo completado', tono: 'ok' },
];
const ESTADOS = ['Prospecto Frío','Contactado','Cita 1 Agendada','Cita 1 Realizada','Cita 2 Agendada','Cita 2 Realizada','En Trámite','Cliente Activo','En Renovación','Cancelada','Standby'];
const RAMOS = ['Vida','Retiro','Gastos Médicos','Ahorro/Inversión'];
const FORMAS = { Anual: 12, Semestral: 6, Trimestral: 3, Mensual: 1 };
const MONEDAS = [['COP', 'Pesos (COP)'], ['USD', 'Dólares (USD)']];
const CODIGOS_MONEDA = MONEDAS.map(m => m[0]);
const TASA_USD_INICIAL = 4000;
const ALIADAS = ['MetLife', 'Allianz', 'BMI', 'Skandia'];
const PRIORIDADES = ['Alta','Media','Baja'];
const EDADES = ['18-25','26-35','36-45','46-55','56-65','65+'];
const CIVILES = ['Soltero(a)','Casado(a)','Unión libre','Divorciado(a)','Viudo(a)'];
const TIPOS_CITA = {
  cita1: 'Cita 1ª · Descubrimiento',
  cita2: 'Cita 2ª · Propuesta',
  anual: 'Revisión anual',
  posventa: 'Seguimiento posventa',
};
const RAMO_ICON = { 'Vida': 'heart-handshake', 'Retiro': 'sunset', 'Gastos Médicos': 'stethoscope', 'Ahorro/Inversión': 'piggy-bank' };

/* ---------- Fechas (siempre YYYY-MM-DD en hora local) ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const hoy = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (s, n) => {
  const d = parse(s), day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  return iso(d);
};
const diasEntre = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const diasHasta = s => diasEntre(hoy(), s);
const mesesEntre = (a, b) => { const x = parse(a), y = parse(b); return (y.getFullYear() - x.getFullYear()) * 12 + (y.getMonth() - x.getMonth()); };
const fFecha = (s, opts = { day: 'numeric', month: 'short' }) => s ? parse(s).toLocaleDateString('es-CO', opts).replace('.', '') : '—';
const fFechaLarga = s => { const t = fFecha(s, { weekday: 'long', day: 'numeric', month: 'long' }); return t[0].toUpperCase() + t.slice(1); };
const fHora = h => { if (!h) return ''; const [H, M] = h.split(':').map(Number); return `${((H + 11) % 12) + 1}:${pad(M)} ${H < 12 ? 'am' : 'pm'}`; };
const relDias = n => n === 0 ? 'hoy' : n === 1 ? 'mañana' : n === -1 ? 'ayer' : n > 0 ? `en ${n} días` : `hace ${-n} días`;
const lunesDe = s => { const d = parse(s); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return iso(d); };

/* Recibos: se cuentan siempre desde el inicio de vigencia para no "derivar" en meses de 31 */
function siguienteRecibo(inicio, forma, despuesDe) {
  const m = FORMAS[forma] || 12;
  for (let k = 1; k < 1200; k++) { const f = addMonths(inicio, k * m); if (f > despuesDe) return f; }
  return addMonths(despuesDe, m);
}
function reciboVigente(inicio, forma) {
  const m = FORMAS[forma] || 12, t = hoy();
  for (let k = 1; k < 1200; k++) { const f = addMonths(inicio, k * m); if (f >= t) return f; }
  return null;
}
function proximoAniversario(inicio) {
  const t = hoy();
  for (let k = 1; k < 100; k++) { const f = addMonths(inicio, 12 * k); if (f >= t) return f; }
  return null;
}

/* ---------- Dinero ---------- */
/* Todo se suma en pesos colombianos; los dólares se convierten con la tasa de Ajustes */
function aCOP(monto, moneda) {
  const n = Number(monto) || 0;
  return moneda === 'USD' ? n * (Number(db.ajustes.usd) || 0) : n;
}
function fDinero(monto, moneda = 'COP', compacto = false) {
  const n = Number(monto) || 0, pre = moneda === 'USD' ? 'US$' : '$';
  const num = (v, d = 0) => v.toLocaleString('es-CO', { maximumFractionDigits: d });
  if (compacto && n >= 1e9) return `${pre}${num(n / 1e9, 1)} mil M`;
  if (compacto && n >= 1e6) return `${pre}${num(n / 1e6, 1)} M`;
  return pre + num(n, moneda === 'USD' ? 2 : 0);
}
const primaRecibo = c => (Number(c.prima) || 0) / (12 / (FORMAS[c.formaPago] || 12));

/* ---------- Utilidades ---------- */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const iniciales = n => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const ahoraTexto = () => new Date().toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const soloDigitos = s => String(s || '').replace(/\D/g, '');
const icon = (name, cls = '') => `<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;

/* ---------- Reglas de negocio ---------- */
const esCliente = c => c.etapa === 'emitida';
const enVentas = c => !esCliente(c) && c.etapa !== 'cancelada';

function cubeta(c) {
  if (!esCliente(c) || !c.proxVencimiento) return 'activa';
  const dv = diasHasta(c.proxVencimiento);
  if (c.gracia || dv < 0) return 'gracia';
  if (dv <= 15) return 'pago';
  const ani = c.inicioVigencia ? proximoAniversario(c.inicioVigencia) : null;
  if (ani && diasHasta(ani) <= 60) return 'renovacion';
  if (c.renovadoEn && diasEntre(c.renovadoEn, hoy()) <= 90) return 'conservada';
  return 'activa';
}
function semaforo(c) {
  if (!esCliente(c)) return null;
  const b = cubeta(c);
  if (b === 'gracia') return 'bad';
  const dv = c.proxVencimiento ? diasHasta(c.proxVencimiento) : 999;
  const ani = c.inicioVigencia ? proximoAniversario(c.inicioVigencia) : null;
  if (dv <= 15 || (ani && diasHasta(ani) < 30)) return 'warn';
  return 'ok';
}
function estadoDe(c) {
  if (c.etapa === 'cancelada') return 'Cancelada';
  if (c.etapa === 'standby') return 'Standby';
  if (esCliente(c)) return cubeta(c) === 'renovacion' ? 'En Renovación' : 'Cliente Activo';
  return c.estado || 'Prospecto Frío';
}
function proximaCita(c) {
  return (c.citas || []).filter(x => x.status === 'programada').sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora))[0];
}
function todasCitas() {
  return db.contactos.flatMap(c => (c.citas || []).map(ci => ({ ...ci, contacto: c })));
}
function lineaGracia(c) {
  const dv = diasHasta(c.proxVencimiento);
  if (dv < -30) return `Vencido hace ${-dv} días · fuera de tolerancia`;
  if (dv < 0) return `Vencido hace ${-dv} días · quedan ${30 + dv} de gracia`;
  return 'Marcado en periodo de gracia';
}

/* ---------- Datos de ejemplo (fechas relativas al día en que se crean) ---------- */
function semilla() {

    fueCliente: false, hitos: {}, notas: [], citas: [], pagos: [], creado: addDays(T, -40), demo: true, ...o });

  const cita = (o) => ({ id: uid(), hora: '10:00', modalidad: 'Virtual', link: '', objetivo: '', status: 'programada', reagendas: 0, bitacora: [], ...o });

  const inicioRicardo = addMonths(addDays(T, 6), -15);
  const inicioDaniela = addMonths(addDays(T, -12), -18);
  const inicioPatricia = addMonths(addDays(T, 25), -36);
  const inicioFernando = addMonths(addDays(T, -20), -24);
  const inicioSofia = addDays(T, -12);

  return [
    c({ nombre: 'Mariana Robles Treviño', telefono: '300 341 2889', whatsapp: '3003412889', email: 'mariana.robles@correo.mx', ocupacion: 'Arquitecta independiente',
      edad: '26-35', civil: 'Casado(a)', hijos: 1, prioridad: 'Alta', ramo: 'Vida', prima: 2400000, moneda: 'COP', etapa: 'cita1', estado: 'Cita 1 Agendada',
      notas: [nota(-3, 'Referida por Sofía Castañeda. Le preocupa proteger a su hija si a ella le pasa algo; su esposo no tiene seguro.')],
      citas: [cita({ tipo: 'cita1', fecha: T, hora: '17:00', modalidad: 'Virtual', link: 'https://meet.google.com/', objetivo: 'Diagnóstico de protección familiar' })] }),
    c({ nombre: 'Jorge Alberto Méndez', telefono: '315 187 6440', whatsapp: '3151876440', email: 'jorge.mendez@empresa.com', ocupacion: 'Director comercial',
      edad: '46-55', civil: 'Casado(a)', hijos: 2, prioridad: 'Alta', ramo: 'Retiro', prima: 12000000, moneda: 'COP', etapa: 'cita2', estado: 'Cita 2 Agendada', hitos: { cita1: addDays(T, -10) },
      notas: [nota(-10, 'Quiere retirarse a los 60 con $8 millones mensuales. Cotiza en Porvenir pero no sabe cuánto lleva.'), nota(-4, 'Propuesta lista: plan de retiro a 15 años con beneficio tributario por aportes voluntarios.')],
      citas: [cita({ tipo: 'cita1', fecha: addDays(T, -10), hora: '09:00', modalidad: 'Presencial', status: 'asistio', objetivo: 'Descubrimiento de metas de retiro' }),
              cita({ tipo: 'cita2', fecha: addDays(T, 2), hora: '13:30', modalidad: 'Presencial', objetivo: 'Presentar plan de retiro y cerrar', reagendas: 1,
                bitacora: [{ fecha: addDays(T, -2), de: addDays(T, -1), a: addDays(T, 2), motivo: 'Viaje de trabajo a Medellín' }] })] }),
    c({ nombre: 'Alejandra Vega Ruiz', telefono: '311 229 0117', whatsapp: '3112290117', ocupacion: 'Médica pediatra', edad: '36-45', civil: 'Soltero(a)', hijos: 0,
      prioridad: 'Media', ramo: 'Gastos Médicos', prima: 6000000, moneda: 'COP', etapa: 'prospecto', estado: 'Contactado',
      notas: [nota(-1, 'Contestó el WhatsApp. Pidió que le llame el lunes después de consulta.')] }),
    c({ nombre: 'Sofía Castañeda Lozano', telefono: '320 908 7332', whatsapp: '3209087332', email: 'sofia.cl@correo.mx', ocupacion: 'Contadora', edad: '36-45', hijos: 2,
      prioridad: 'Media', ramo: 'Gastos Médicos', aseguradora: 'Allianz', poliza: 'GMM-0048213', formaPago: 'Mensual', inicioVigencia: inicioSofia,
      proxVencimiento: addMonths(inicioSofia, 1), prima: 7200000, moneda: 'COP', etapa: 'emitida', estado: 'Cliente Activo', fueCliente: true,
      hitos: { cita1: addDays(T, -35), cita2: addDays(T, -22), cierre: addDays(T, -12) },
      notas: [nota(-12, 'Póliza emitida. Plan familiar, deducible de $2 millones. Le enviaré la tarjeta digital.')], pagos: [{ id: uid(), fecha: addDays(T, -12), monto: 600000, moneda: 'COP', recibo: inicioSofia }] }),
    c({ nombre: 'Ricardo Ibarra Solís', telefono: '301 441 0778', whatsapp: '3014410778', email: 'ribarra@correo.mx', ocupacion: 'Empresario restaurantero', edad: '46-55', hijos: 3,

      prioridad: 'Alta', ramo: 'Retiro', aseguradora: 'Skandia', poliza: 'RET-3390127', formaPago: 'Semestral', inicioVigencia: inicioDaniela,

      hitos: { cita1: addMonths(T, -20), cita2: addMonths(T, -19), cierre: inicioDaniela },
      notas: [nota(-5, 'No ha pagado el recibo semestral. Dice que cambió de tarjeta. Mandar liga de pago.')] }),
    c({ nombre: 'Patricia León Garza', telefono: '310 665 5209', whatsapp: '3106655209', ocupacion: 'Abogada', edad: '56-65', hijos: 2,

      hitos: { cita1: addMonths(T, -38), cita2: addMonths(T, -37), cierre: inicioPatricia } }),
    c({ nombre: 'Fernando Aguilar Paz', telefono: '304 218 7665', whatsapp: '3042187665', email: 'fer.aguilar@correo.mx', ocupacion: 'Ingeniero de software', edad: '26-35', civil: 'Unión libre', hijos: 0,
      prioridad: 'Baja', ramo: 'Vida', aseguradora: 'Allianz', poliza: 'VID-5520871', formaPago: 'Anual', inicioVigencia: inicioFernando,
      proxVencimiento: addMonths(inicioFernando, 36), prima: 1800000, moneda: 'COP', etapa: 'emitida', estado: 'Cliente Activo', fueCliente: true,
      renovadoEn: addDays(T, -20), renovaciones: 1, hitos: { cita1: addMonths(T, -26), cita2: addMonths(T, -25), cierre: inicioFernando },

let db;
function cargar() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.contactos)) return d; }
  } catch (e) { console.warn('No se pudo leer el guardado', e); }
  return null;
}
function guardar() {
  db.guardadoEn = new Date().toISOString();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); estadoGuardado(true); }
  catch (e) { estadoGuardado(false); toast('No se pudo guardar en este navegador. Descarga un respaldo desde Ajustes.', { tono: 'bad' }); }
}
function estadoGuardado(ok) {
  document.querySelectorAll('[data-saved]').forEach(el => {
    el.innerHTML = ok ? `${icon('cloud-check', 'w-3.5 h-3.5')} Guardado ${new Date().toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' })}` : `${icon('cloud-off', 'w-3.5 h-3.5')} Sin guardar`;
  });
  pintarIconos();
}

if (!cargar()) guardar();
/* Versión 2: el CRM pasa a pesos colombianos + dólares (antes MXN/USD/UDIs) */
if ((db.version || 1) < 2) {
  if (db.esDemo) {
    const nombres = new Set(semilla().map(c => c.nombre));
    db.contactos = [...semilla(), ...db.contactos.filter(c => !c.demo && !nombres.has(c.nombre))];
  }
  db.contactos.forEach(c => { if (!CODIGOS_MONEDA.includes(c.moneda)) c.moneda = 'COP'; (c.pagos || []).forEach(p => { if (!CODIGOS_MONEDA.includes(p.moneda)) p.moneda = c.moneda; }); });
  db.ajustes = { ...db.ajustes, usd: TASA_USD_INICIAL }; delete db.ajustes.udi;
  db.version = 2; guardar();
}
/* Guardados anteriores no marcaban los ejemplos: se reconocen por nombre para no borrar contactos reales */
if (db.esDemo && !db.contactos.some(c => c.demo)) {
  const nombres = new Set(semilla().map(c => c.nombre));

}

function kpis() {
  const cs = db.contactos;
  const pipeline = cs.filter(c => enVentas(c) && c.etapa !== 'standby');
  const clientes = cs.filter(esCliente);
  const renovadas = cs.reduce((s, c) => s + (Number(c.renovaciones) || 0), 0);
  const canceladas = cs.filter(c => c.etapa === 'cancelada' && c.fueCliente).length;
  return {
    pipeline: pipeline.reduce((s, c) => s + aCOP(c.prima, c.moneda), 0), nPipeline: pipeline.length,
    conservada: clientes.reduce((s, c) => s + aCOP(c.prima, c.moneda), 0),
    riesgo: clientes.filter(c => cubeta(c) === 'gracia').reduce((s, c) => s + aCOP(primaRecibo(c), c.moneda), 0),
    renovadas, canceladas, persistencia: renovadas + canceladas ? Math.round(renovadas / (renovadas + canceladas) * 100) : null,
    n1: cs.filter(c => c.hitos?.cita1).length, n2: cs.filter(c => c.hitos?.cita2).length, n3: cs.filter(c => c.hitos?.cierre).length,
  };
}

  return `<div class="flex flex-col gap-3">${filas.map(([n, v, r], i) => `
    <div><div class="flex items-baseline justify-between text-[13.5px] mb-1"><span class="text-ink2">${n}</span><span><span class="font-semibold">${v}</span>${r ? ` <span class="text-ink3 text-[12px]">· ${r} pasa</span>` : ''}</span></div>
    <div class="h-2.5 rounded-full bg-sunken overflow-hidden"><div class="bar h-full rounded-full ${i === 2 ? 'bg-ok' : 'bg-brand'}" style="width:${Math.max(4, v / max * 100)}%; animation-delay:${i * 90}ms"></div></div></div>`).join('')}
    <p class="text-[12.5px] text-ink2 mt-1">${k.n1 ? `De cada 10 primeras citas, <strong class="font-semibold">${Math.round(k.n3 / k.n1 * 10)}</strong> terminan en póliza.` : 'Registra asistencia a tus citas para ver tu conversión.'}</p></div>`;
}

function tarjetaPosventa(c) {
  const b = cubeta(c), t = semaforo(c), dv = diasHasta(c.proxVencimiento);

  else if (b === 'conservada') linea = `<span class="text-ok font-medium">Renovada el ${fFecha(c.renovadoEn)}</span>`;

function waLink(c, b) {

  return `https://wa.me/57${soloDigitos(c.whatsapp).slice(-10)}?text=${encodeURIComponent(msg)}`;

/* ---------- CITAS ---------- */
function vistaCitas() {
  const ini = ui.semana, fin = addDays(ini, 6), T = hoy();
  const filtro = ui.filtroCitas;
  const pasaFiltro = x => filtro === 'todas' || (filtro === 'ventas' ? ['cita1', 'cita2'].includes(x.tipo) : ['anual', 'posventa'].includes(x.tipo));
  const citas = todasCitas().filter(pasaFiltro);
  const semana = citas.filter(x => x.fecha >= ini && x.fecha <= fin).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  const pendientes = citas.filter(x => x.status === 'noasistio' || (x.status === 'programada' && x.fecha < T));
  const dias = Array.from({ length: 7 }, (_, i) => addDays(ini, i));
  const rango = `${fFecha(ini, { day: 'numeric', month: 'short' })} – ${fFecha(fin, { day: 'numeric', month: 'short', year: 'numeric' })}`;
  return `
  ${encabezado('Citas', (n => `${n} ${n === 1 ? 'programada' : 'programadas'} esta semana`)(semana.filter(x => x.status === 'programada').length), `<button class="btn-primary" data-act="cita">${icon('calendar-plus', 'w-4 h-4')} <span class="hidden sm:inline">Agendar cita</span><span class="sm:hidden">Agendar</span></button>`)}
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <div class="flex items-center gap-1 card px-1 py-1 rounded-xl!">
      <button class="btn-ghost btn-sm px-2!" data-act="semana" data-delta="-7" aria-label="Semana anterior">${icon('chevron-left', 'w-4 h-4')}</button>
      <p class="text-[14px] font-medium px-1 min-w-[150px] text-center">${rango}</p>
      <button class="btn-ghost btn-sm px-2!" data-act="semana" data-delta="7" aria-label="Semana siguiente">${icon('chevron-right', 'w-4 h-4')}</button>
    </div>
    ${ini !== lunesDe(T) ? `<button class="btn-ghost btn-sm" data-act="semana" data-delta="0">Hoy</button>` : ''}
    <div class="flex gap-2 scroll-x">${[['todas', 'Todas'], ['ventas', 'De venta'], ['posventa', 'Posventa']].map(([id, n]) => `<button class="chip" data-act="filtro-citas" data-f="${id}" aria-pressed="${filtro === id}">${n}</button>`).join('')}</div>
  </div>

  ${pendientes.length ? `<section class="card p-4 mb-4 border-bad/30! fade-in" aria-labelledby="h-pend">
    <h2 id="h-pend" class="font-sans! text-[14px] font-semibold text-bad flex items-center gap-2 mb-2">${icon('calendar-x', 'w-4 h-4')} Por reagendar (${pendientes.length})</h2>
    <ul class="divide-y divide-line">${pendientes.map(x => filaCita(x, true)).join('')}</ul></section>` : ''}

  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3 stagger">
    ${dias.map(d => {
      const items = semana.filter(x => x.fecha === d);
      const esHoy = d === T;
      if (!items.length && !esHoy) return '';
      return `<section class="card p-4 min-w-0 ${esHoy ? 'ring-2 ring-brand/30' : ''}">
        <h2 class="font-sans! text-[13px] font-semibold uppercase tracking-[0.06em] ${esHoy ? 'text-brand' : 'text-ink3'} mb-1 capitalize">${esHoy ? 'Hoy · ' : ''}${fFecha(d, { weekday: 'long', day: 'numeric', month: 'short' })}</h2>
        ${items.length ? `<ul class="divide-y divide-line">${items.map(x => filaCita(x)).join('')}</ul>` : `<p class="text-[13px] text-ink3 py-2">Sin citas hoy.</p>`}
      </section>`;
    }).join('') || ''}
  </div>
  ${!semana.length ? `<div class="card p-8 text-center mt-3"><div class="icon-chip bg-brand-soft text-brand mx-auto mb-3">${icon('calendar-search', 'w-5 h-5')}</div><p class="font-display text-[20px]">Semana despejada</p><p class="text-[13.5px] text-ink2 mt-1 mb-4">No hay citas entre ${rango}.</p><button class="btn-primary" data-act="cita">${icon('calendar-plus', 'w-4 h-4')} Agendar cita</button></div>` : ''}`;
}
function estadoCitaTag(x) {
  const m = { programada: ['bg-brand-soft text-brand', 'Programada'], asistio: ['bg-ok-soft text-ok', 'Asistió'], noasistio: ['bg-bad-soft text-bad', 'No asistió'], cancelada: ['bg-sunken text-ink3', 'Cancelada'] };
  const [cls, t] = m[x.status] || m.programada;

}
function filaCita(x, pendiente = false) {

function botonesAsistencia(cid, xid, sobreMarca = false) {

/* ---------- CONTACTOS ---------- */
const FILTROS = [
  ['todos', 'Todos'], ['prospectos', 'Prospectos'], ['clientes', 'Clientes'], ['alta', 'Prioridad alta'],
  ['vencidas', 'Prima vencida este mes'], ['renov30', 'Renovaciones 30 días'], ['citaspos', 'Citas posventa'], ['inactivos', 'Standby / canceladas'],
];
function aplicaFiltro(c, f) {
  switch (f) {
    case 'prospectos': return enVentas(c) && c.etapa !== 'standby';
    case 'clientes': return esCliente(c);
    case 'alta': return c.prioridad === 'Alta';
    case 'vencidas': return esCliente(c) && cubeta(c) === 'gracia';
    case 'renov30': { if (!esCliente(c) || !c.inicioVigencia) return false; const a = proximoAniversario(c.inicioVigencia); return a && diasHasta(a) <= 30; }
    case 'citaspos': return (c.citas || []).some(x => ['anual', 'posventa'].includes(x.tipo) && x.status === 'programada');
    case 'inactivos': return ['standby', 'cancelada'].includes(c.etapa);
    default: return true;
  }
}
function vistaContactos() {
  const q = ui.busqueda.trim().toLowerCase();
  const lista = db.contactos.filter(c => aplicaFiltro(c, ui.filtro)).filter(c => !q || [c.nombre, c.poliza, c.prioridad, c.telefono, c.email, c.aseguradora, c.ramo].join(' ').toLowerCase().includes(q))
    .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  return `
  ${encabezado('Contactos', `${db.contactos.length} en total`, `<button class="btn-primary hidden sm:inline-flex" data-act="nuevo">${icon('user-plus', 'w-4 h-4')} Nuevo contacto</button>`)}
  <div class="relative mb-3">
    ${icon('search', 'w-[18px] h-[18px] absolute left-3.5 top-1/2 -translate-y-1/2 text-ink3')}

  </div>
  <div class="scroll-x -mx-4 px-4 md:mx-0 md:px-0 flex md:flex-wrap gap-2 pb-3">
    ${FILTROS.map(([id, n]) => `<button class="chip" data-act="filtro" data-f="${id}" aria-pressed="${ui.filtro === id}">${n} <span class="opacity-70">${db.contactos.filter(c => aplicaFiltro(c, id)).length}</span></button>`).join('')}
  </div>
  <div id="lista-contactos">${listaContactos(lista)}</div>`;
}
function listaContactos(lista) {
  if (!lista.length) return `<div class="card p-8 text-center"><div class="icon-chip bg-brand-soft text-brand mx-auto mb-3">${icon('search-x', 'w-5 h-5')}</div><p class="font-display text-[20px]">Nadie coincide</p><p class="text-[13.5px] text-ink2 mt-1 mb-4">Prueba con otro nombre o quita el filtro.</p><button class="btn-soft" data-act="limpiar">Ver todos</button></div>`;
  return `<ul class="card divide-y divide-line overflow-hidden">${lista.map(c => {

      <span class="block text-[12.5px] text-ink3 truncate">${sub}</span></span>
      <span class="hidden sm:flex items-center gap-1.5">${ramoTag(c.ramo)}${prioridadTag(c.prioridad)}</span>

  }).join('')}</ul>`;
}

const opciones = (arr, sel) => arr.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(t)}</option>`; }).join('');

/* ---------- Detalle del contacto ---------- */
function abrirDetalle(id, refrescar = false) {
  const c = getC(id); if (!c) return;
  ui.detalle = id;
  const t = semaforo(c), b = esCliente(c) ? cubeta(c) : null;
  const citas = [...(c.citas || [])].sort((a, b2) => (b2.fecha + b2.hora).localeCompare(a.fecha + a.hora));
  const notas = [...(c.notas || [])].sort((a, b2) => (b2.fecha + (b2.hora || '')).localeCompare(a.fecha + (a.hora || '')));
  const etapas = [...VENTAS.map(e => [e.id, e.id === 'emitida' ? 'Póliza emitida (cliente)' : e.nombre]), ['cancelada', 'Cancelada']];
  const html = `
  ${cabeceraModal(esc(c.nombre), `${estadoDe(c)}${c.ocupacion ? ` · ${esc(c.ocupacion)}` : ''}`)}
  <div class="px-5 py-4 flex flex-col gap-4">
    <div class="flex flex-wrap items-center gap-1.5">${prioridadTag(c.prioridad)}${ramoTag(c.ramo)}${t ? `<span class="tag ${TONOS[t].tag}"><span class="dot ${TONOS[t].dot}"></span>${b === 'gracia' ? 'Periodo de gracia' : TONOS[t].texto}</span>` : ''}</div>

    <div class="grid grid-cols-4 gap-2">
      ${c.whatsapp ? `<a class="btn-soft flex-col gap-1! py-2 text-[12px]" href="${waLink(c, b)}" target="_blank" rel="noopener">${icon('message-circle', 'w-5 h-5 text-ok')}WhatsApp</a>` : `<span class="btn-soft flex-col gap-1! py-2 text-[12px] opacity-50">${icon('message-circle', 'w-5 h-5')}Sin WhatsApp</span>`}
      ${c.telefono ? `<a class="btn-soft flex-col gap-1! py-2 text-[12px]" href="tel:${soloDigitos(c.telefono)}">${icon('phone', 'w-5 h-5 text-brand')}Llamar</a>` : `<span class="btn-soft flex-col gap-1! py-2 text-[12px] opacity-50">${icon('phone', 'w-5 h-5')}Sin teléfono</span>`}
      <button class="btn-soft flex-col gap-1! py-2 text-[12px]" data-act="cita" data-id="${c.id}">${icon('calendar-plus', 'w-5 h-5 text-brand')}Cita</button>
      <button class="btn-soft flex-col gap-1! py-2 text-[12px]" data-act="nota" data-id="${c.id}">${icon('notebook-pen', 'w-5 h-5 text-brand')}Nota</button>
    </div>

    <label class="field"><span>Etapa en el pipeline</span>
      <select class="input" data-change="etapa" data-id="${c.id}">${opciones(etapas, c.etapa)}</select></label>
    ${!esCliente(c) && !['standby', 'cancelada'].includes(c.etapa) ? `<label class="field"><span>Estado en el embudo</span><select class="input" data-change="estado" data-id="${c.id}">${opciones(ESTADOS.slice(0, 7), c.estado)}</select></label>` : ''}

    ${esCliente(c) ? `
    <section class="card p-4 ${b === 'gracia' ? 'border-bad/40!' : ''}">
      <div class="flex items-center justify-between mb-3"><h3 class="text-[17px]">Póliza y cobranza</h3><span class="text-[12px] text-ink3">${esc(c.aseguradora)}</span></div>
      <dl class="grid grid-cols-2 gap-x-4 gap-y-3 text-[13.5px]">
        <div><dt class="label">Póliza</dt><dd class="font-medium">${esc(c.poliza) || '—'}</dd></div>
        <div><dt class="label">Forma de pago</dt><dd class="font-medium">${esc(c.formaPago)}</dd></div>
        <div><dt class="label">Prima anual</dt><dd class="font-medium">${fDinero(c.prima, c.moneda)}</dd></div>
        <div><dt class="label">Cada recibo</dt><dd class="font-medium">${fDinero(primaRecibo(c), c.moneda)}</dd></div>
        <div><dt class="label">Próximo recibo</dt><dd class="font-medium ${b === 'gracia' ? 'text-bad' : b === 'pago' ? 'text-warn' : ''}">${fFecha(c.proxVencimiento, { day: 'numeric', month: 'short', year: 'numeric' })}<span class="block text-[12px] font-normal text-ink3">${c.proxVencimiento ? relDias(diasHasta(c.proxVencimiento)) : ''}</span></dd></div>
        <div><dt class="label">Aniversario</dt><dd class="font-medium">${c.inicioVigencia ? fFecha(proximoAniversario(c.inicioVigencia), { day: 'numeric', month: 'short', year: 'numeric' }) : '—'}<span class="block text-[12px] font-normal text-ink3">Vigente desde ${fFecha(c.inicioVigencia, { month: 'short', year: 'numeric' })}</span></dd></div>
      </dl>
      ${b === 'gracia' ? `<p class="mt-3 text-[13px] text-bad bg-bad-soft rounded-xl px-3 py-2">${icon('alert-triangle', 'w-4 h-4 inline -mt-0.5')} ${lineaGracia(c)}</p>` : ''}
      <div class="grid grid-cols-2 gap-2 mt-4">
        <button class="btn-primary btn-sm" data-act="pago" data-id="${c.id}">${icon('badge-dollar-sign', 'w-4 h-4')} Registrar pago</button>
        <button class="btn-soft btn-sm" data-act="cita" data-id="${c.id}" data-tipo="anual">${icon('calendar-heart', 'w-4 h-4')} Revisión anual</button>
        ${b !== 'gracia' ? `<button class="btn-ghost btn-sm col-span-2" data-act="gracia" data-id="${c.id}">${icon('hourglass', 'w-4 h-4')} Marcar en periodo de gracia</button>` : c.gracia ? `<button class="btn-ghost btn-sm col-span-2" data-act="quitar-gracia" data-id="${c.id}">Quitar marca de gracia</button>` : ''}
      </div>
      ${(c.pagos || []).length ? `<details class="mt-3"><summary class="text-[13px] text-brand font-medium cursor-pointer py-1">Historial de pagos (${c.pagos.length})</summary>
        <ul class="mt-2 divide-y divide-line text-[13px]">${[...c.pagos].sort((a, b2) => b2.fecha.localeCompare(a.fecha)).map(p => `<li class="py-1.5 flex justify-between gap-2"><span>${fFecha(p.fecha, { day: 'numeric', month: 'short', year: 'numeric' })}<span class="text-ink3"> · recibo ${fFecha(p.recibo)}</span></span><span class="font-medium">${fDinero(p.monto, p.moneda)}</span></li>`).join('')}</ul></details>` : ''}
    </section>` : ''}

    <section class="card p-4">
      <div class="flex items-center justify-between mb-2"><h3 class="text-[17px]">Citas</h3><button class="btn-ghost btn-sm" data-act="cita" data-id="${c.id}">${icon('plus', 'w-4 h-4')} Agendar</button></div>
      ${citas.length ? `<ul class="divide-y divide-line">${citas.map(x => `
        <li class="py-2.5">
          <div class="flex items-start gap-2"><div class="min-w-0 flex-1"><p class="text-[14px] font-medium">${TIPOS_CITA[x.tipo]}</p>
            <p class="text-[12.5px] text-ink2">${fFecha(x.fecha, { weekday: 'short', day: 'numeric', month: 'short' })} · ${fHora(x.hora)} · ${x.modalidad}</p>
            ${x.objetivo ? `<p class="text-[12.5px] text-ink3">${esc(x.objetivo)}</p>` : ''}</div>${estadoCitaTag(x)}</div>
          ${x.status === 'programada' ? `<div class="flex gap-1.5 mt-2 flex-wrap">${botonesAsistencia(c.id, x.id)}</div>` : x.status === 'noasistio' ? `<button class="btn-primary btn-sm mt-2" data-act="reagendar" data-id="${c.id}" data-cita="${x.id}">${icon('calendar-clock', 'w-4 h-4')} Reagendar</button>` : ''}
          ${x.reagendas ? `<details class="mt-1.5"><summary class="text-[12.5px] text-warn cursor-pointer">Reagendada ${x.reagendas} ${x.reagendas === 1 ? 'vez' : 'veces'} · ver motivos</summary>
            <ul class="mt-1 text-[12.5px] text-ink2 flex flex-col gap-1">${x.bitacora.map(r => `<li>${fFecha(r.fecha)}: de ${fFecha(r.de)} a ${fFecha(r.a)}${r.motivo ? ` — “${esc(r.motivo)}”` : ''}</li>`).join('')}</ul></details>` : ''}
        </li>`).join('')}</ul>` : `<p class="text-[13px] text-ink3 py-1">Sin citas todavía. Agenda la primera para avanzarlo en el pipeline.</p>`}
    </section>

    <section class="card p-4">
      <div class="flex items-center justify-between mb-2"><h3 class="text-[17px]">Bitácora</h3><button class="btn-ghost btn-sm" data-act="nota" data-id="${c.id}">${icon('plus', 'w-4 h-4')} Nota</button></div>
      ${notas.length ? `<ol class="relative border-l border-line ml-1.5 flex flex-col gap-3 py-1">${notas.map(n => `<li class="pl-4 relative"><span class="absolute -left-[5px] top-1.5 w-2.5 h-2.5 rounded-full bg-brand ring-4 ring-surface"></span>
        <p class="text-[12px] text-ink3">${fFecha(n.fecha, { day: 'numeric', month: 'short', year: 'numeric' })}${n.hora ? ` · ${fHora(n.hora)}` : ''}</p><p class="text-[14px] whitespace-pre-line">${esc(n.texto)}</p></li>`).join('')}</ol>`
      : `<p class="text-[13px] text-ink3 py-1">Anota aquí cada llamada, acuerdo o detalle personal. Tu yo del próximo año te lo agradecerá.</p>`}
    </section>

    <section class="card p-4">
      <div class="flex items-center justify-between mb-2"><h3 class="text-[17px]">Datos personales</h3><button class="btn-ghost btn-sm" data-act="editar" data-id="${c.id}">${icon('pencil', 'w-4 h-4')} Editar</button></div>
      <dl class="grid grid-cols-2 gap-x-4 gap-y-3 text-[13.5px]">
        ${[['Teléfono', c.telefono], ['WhatsApp', c.whatsapp], ['Email', c.email], ['Edad', c.edad], ['Estado civil', c.civil], ['Hijos', c.hijos], ['Aseguradora', c.aseguradora], ['Prima anual', c.prima ? fDinero(c.prima, c.moneda) : '']]
          .map(([k, v]) => `<div class="min-w-0"><dt class="label">${k}</dt><dd class="truncate">${v === '' || v == null ? '<span class="text-ink3">—</span>' : esc(v)}</dd></div>`).join('')}
      </dl>
    </section>

    <button class="btn-ghost text-bad! self-start" data-act="eliminar" data-id="${c.id}">${icon('trash-2', 'w-4 h-4')} Eliminar contacto</button>
  </div>`;
  if (refrescar && document.querySelector('#modal-root [role=dialog]')) {
    const panel = document.querySelector('#modal-root .sheet'); const top = panel.scrollTop;
    panel.innerHTML = html; panel.scrollTop = top; pintarIconos();
  } else abrirModal(html, { lateral: true });
}

/* ---------- Nuevo / editar contacto ---------- */
function abrirFormContacto(id, aviso = '') {
  const c = id ? getC(id) : { prioridad: 'Media', ramo: 'Vida', formaPago: 'Anual', moneda: 'COP', edad: '36-45', civil: 'Casado(a)', hijos: 0, etapa: 'prospecto' };
  const sel = (name, arr, val) => `<select class="input" name="${name}">${opciones(arr, val)}</select>`;
  const asegSel = !c.aseguradora ? '' : ALIADAS.includes(c.aseguradora) ? c.aseguradora : 'Otra';
  const polizaAbierta = !!aviso || ['tramite', 'emitida'].includes(c.etapa) || !!c.poliza;
  const inp = (name, val, type = 'text', extra = '') => `<input class="input" name="${name}" type="${type}" value="${esc(val ?? '')}" ${extra} />`;
  abrirModal(`
  ${cabeceraModal(id ? 'Editar contacto' : 'Nuevo contacto', id ? esc(c.nombre) : 'Solo el nombre es obligatorio; lo demás lo completas cuando lo sepas')}
  <form data-form="contacto" data-id="${id || ''}" class="px-5 py-4 flex flex-col gap-5" novalidate>
    ${aviso ? `<p class="text-[13px] bg-warn-soft text-warn rounded-xl px-3 py-2">${aviso}</p>` : ''}
    <fieldset class="flex flex-col gap-3"><legend class="label mb-2">Persona</legend>
      <label class="field"><span>Nombre completo *</span>${inp('nombre', c.nombre, 'text', 'required autocomplete="off"')}<small class="text-bad text-[12px] hidden" data-err="nombre">Escribe el nombre para poder guardarlo.</small></label>
      <div class="grid grid-cols-2 gap-3">
        <label class="field"><span>Teléfono</span>${inp('telefono', c.telefono, 'tel', 'inputmode="tel"')}</label>
        <label class="field"><span>WhatsApp</span>${inp('whatsapp', c.whatsapp, 'tel', 'inputmode="tel" placeholder="10 dígitos"')}</label>
      </div>
      <label class="field"><span>Email</span>${inp('email', c.email, 'email', 'inputmode="email"')}</label>
      <label class="field"><span>Ocupación</span>${inp('ocupacion', c.ocupacion)}</label>
      <div class="grid grid-cols-3 gap-3">
        <label class="field"><span>Edad</span>${sel('edad', EDADES, c.edad)}</label>
        <label class="field col-span-1"><span>Estado civil</span>${sel('civil', CIVILES, c.civil)}</label>
        <label class="field"><span>Hijos</span>${inp('hijos', c.hijos, 'number', 'min="0" max="15" inputmode="numeric"')}</label>
      </div>
    </fieldset>
    <fieldset class="flex flex-col gap-3"><legend class="label mb-2">Oportunidad</legend>
      <div class="grid grid-cols-2 gap-3">
        <label class="field"><span>Prioridad</span>${sel('prioridad', PRIORIDADES, c.prioridad)}</label>
        <label class="field"><span>Ramo</span>${sel('ramo', RAMOS, c.ramo)}</label>
      </div>
      ${!id ? `<label class="field"><span>Etapa</span><select class="input" name="etapa" data-change="etapa-form">${opciones(VENTAS.map(e => [e.id, e.nombre]), c.etapa)}</select></label>` : ''}
      <div class="grid grid-cols-[1fr_150px] gap-3">
        <label class="field"><span>Prima anual ${c.etapa === 'emitida' ? '' : '(estimada)'}</span>${inp('prima', c.prima || '', 'number', 'min="0" step="any" inputmode="decimal"')}</label>
        <label class="field"><span>Moneda</span>${sel('moneda', MONEDAS, c.moneda)}</label>
      </div>
    </fieldset>
    <details class="group rounded-2xl border border-line bg-surface" data-poliza ${polizaAbierta ? 'open' : ''}>
      <summary class="list-none cursor-pointer flex items-center gap-3 p-4 min-h-11">
        <span class="icon-chip bg-brand-soft text-brand w-9! h-9!">${icon('file-badge', 'w-[18px] h-[18px]')}</span>
        <span class="flex-1 min-w-0"><span class="block font-medium text-[14.5px]">Póliza y pagos</span><span class="block text-[12.5px] text-ink3">${polizaAbierta ? 'Datos de la póliza emitida' : 'Llénalo cuando se emita la póliza · por ahora puedes dejarlo vacío'}</span></span>
        ${icon('chevron-down', 'w-4 h-4 text-ink3 transition group-open:rotate-180')}
      </summary>
    <fieldset class="flex flex-col gap-3 px-4 pb-4">
      <div class="grid grid-cols-2 gap-3">
        <label class="field"><span>Aseguradora</span><select class="input" name="aseguradoraSel" data-change="aseg">${opciones([['', 'Elige…'], ...ALIADAS, ['Otra', 'Otra…']], asegSel)}</select></label>
        <label class="field"><span>Núm. de póliza</span>${inp('poliza', c.poliza)}</label>
        <label class="field col-span-2 ${asegSel === 'Otra' ? '' : 'hidden'}" data-otra><span>¿Cuál aseguradora?</span>${inp('aseguradoraOtra', asegSel === 'Otra' ? c.aseguradora : '', 'text', 'placeholder="Escribe el nombre"')}</label>
        <label class="field"><span>Forma de pago</span>${sel('formaPago', Object.keys(FORMAS), c.formaPago)}</label>
        <label class="field"><span>Inicio de vigencia</span>${inp('inicioVigencia', c.inicioVigencia, 'date')}</label>
      </div>
      <label class="field"><span>Próximo vencimiento de prima</span>
        <div class="flex gap-2">${inp('proxVencimiento', c.proxVencimiento, 'date')}<button type="button" class="btn-soft shrink-0" data-act="calcular">${icon('calculator', 'w-4 h-4')} Calcular</button></div>
        <small class="text-[12px] text-ink3">Si lo dejas vacío, lo calculo con el inicio de vigencia y la forma de pago.</small></label>
    </fieldset>
    </details>
    <div class="sticky bottom-0 -mx-5 px-5 py-3 bg-bg/95 backdrop-blur border-t border-line flex gap-2">
      <button type="button" class="btn-ghost" data-act="cerrar">Cancelar</button>
      <button type="submit" class="btn-primary flex-1">${icon('check', 'w-4 h-4')} ${id ? 'Guardar cambios' : 'Agregar contacto'}</button>
    </div>
  </form>`);
}

/* ---------- Agendar cita ---------- */
function abrirFormCita(id, tipo) {
  const c = id ? getC(id) : null;
  const sugerido = tipo || (!c ? 'cita1' : esCliente(c) ? 'anual' : c.etapa === 'propuesta' || c.etapa === 'cita2' || c.hitos?.cita1 ? 'cita2' : 'cita1');
  const contactos = [...db.contactos].filter(x => x.etapa !== 'cancelada').sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  abrirModal(`
  ${cabeceraModal('Agendar cita', c ? esc(c.nombre) : '')}
  <form data-form="cita" class="px-5 py-4 flex flex-col gap-3" novalidate>
    ${c ? `<input type="hidden" name="cid" value="${c.id}">` : `<label class="field"><span>Contacto</span><select class="input" name="cid">${opciones(contactos.map(x => [x.id, x.nombre]))}</select></label>`}
    <label class="field"><span>Tipo de cita</span><select class="input" name="tipo">${opciones(Object.entries(TIPOS_CITA), sugerido)}</select></label>
    <div class="grid grid-cols-2 gap-3">
      <label class="field"><span>Fecha</span><input class="input" type="date" name="fecha" value="${addDays(hoy(), 1)}" min="${addDays(hoy(), -30)}" required></label>
      <label class="field"><span>Hora</span><input class="input" type="time" name="hora" value="10:00" step="900" required></label>
    </div>
    <fieldset class="field"><span class="text-[12.5px] font-medium text-ink2">Modalidad</span>
      <div class="grid grid-cols-2 gap-2">${['Virtual', 'Presencial'].map((m, i) => `<label class="chip justify-center has-[:checked]:bg-brand has-[:checked]:text-on-brand has-[:checked]:border-brand min-h-11!"><input type="radio" name="modalidad" value="${m}" class="sr-only" ${i === 0 ? 'checked' : ''}>${icon(m === 'Virtual' ? 'video' : 'map-pin', 'w-4 h-4')} ${m === 'Virtual' ? 'Virtual (Meet/Zoom)' : 'Presencial'}</label>`).join('')}</div></fieldset>
    <label class="field"><span>Liga o lugar</span><input class="input" name="link" placeholder="https://meet.google.com/… o dirección"></label>
    <label class="field"><span>Objetivo de la reunión</span><input class="input" name="objetivo" placeholder="Ej. Diagnóstico de protección familiar"></label>
    <div class="flex gap-2 pt-2"><button type="button" class="btn-ghost" data-act="cerrar">Cancelar</button><button class="btn-primary flex-1">${icon('calendar-check', 'w-4 h-4')} Agendar</button></div>
  </form>`);
}

/* ---------- Reagendar ---------- */
function abrirReagendar(cid, xid) {
  const c = getC(cid), x = c.citas.find(y => y.id === xid);
  abrirModal(`
  ${cabeceraModal('Reagendar cita', `${esc(c.nombre)} · ${TIPOS_CITA[x.tipo]}${x.reagendas ? ` · ya se movió ${x.reagendas}×` : ''}`)}
  <form data-form="reagendar" data-id="${cid}" data-cita="${xid}" class="px-5 py-4 flex flex-col gap-3" novalidate>
    <p class="text-[13px] text-ink2">Antes: ${fFecha(x.fecha, { weekday: 'long', day: 'numeric', month: 'long' })} · ${fHora(x.hora)}</p>
    <div class="grid grid-cols-2 gap-3">
      <label class="field"><span>Nueva fecha</span><input class="input" type="date" name="fecha" value="${addDays(hoy(), 2)}" required></label>
      <label class="field"><span>Hora</span><input class="input" type="time" name="hora" value="${x.hora}" step="900" required></label>
    </div>
    <label class="field"><span>Motivo</span><input class="input" name="motivo" placeholder="Ej. Se le cruzó una junta"></label>
    <div class="flex flex-wrap gap-2">${['Se le cruzó otra reunión', 'Enfermedad', 'Viaje', 'No contestó', 'Lo pidió el cliente'].map(m => `<button type="button" class="chip" data-act="motivo" data-m="${m}">${m}</button>`).join('')}</div>
    <div class="flex gap-2 pt-2"><button type="button" class="btn-ghost" data-act="cerrar">Cancelar</button><button class="btn-primary flex-1">${icon('calendar-clock', 'w-4 h-4')} Guardar nueva fecha</button></div>
  </form>`);
}

/* ---------- Registrar pago ---------- */
function abrirPago(cid) {
  const c = getC(cid);
  if (!c.inicioVigencia || !c.proxVencimiento) { abrirFormContacto(cid, 'Completa el inicio de vigencia y el próximo vencimiento para poder registrar pagos.'); return; }
  const nuevo = siguienteRecibo(c.inicioVigencia, c.formaPago, c.proxVencimiento);
  const esAniv = mesesEntre(c.inicioVigencia, c.proxVencimiento) > 0 && mesesEntre(c.inicioVigencia, c.proxVencimiento) % 12 === 0;
  abrirModal(`
  ${cabeceraModal('Registrar pago', `${esc(c.nombre)} · póliza ${esc(c.poliza)}`)}
  <form data-form="pago" data-id="${cid}" class="px-5 py-4 flex flex-col gap-3" novalidate>
    <div class="card p-4 flex items-center gap-3"><div class="icon-chip bg-ok-soft text-ok">${icon('receipt', 'w-5 h-5')}</div>
      <div class="min-w-0"><p class="text-[13px] text-ink2">Recibo del ${fFecha(c.proxVencimiento, { day: 'numeric', month: 'long', year: 'numeric' })}</p><p class="font-display text-[24px] leading-tight">${fDinero(primaRecibo(c), c.moneda)}</p></div></div>
    <div class="grid grid-cols-2 gap-3">
      <label class="field"><span>Fecha de pago</span><input class="input" type="date" name="fecha" value="${hoy()}" max="${hoy()}" required></label>
      <label class="field"><span>Monto (${esc(c.moneda)})</span><input class="input" type="number" step="any" min="0" name="monto" value="${Math.round(primaRecibo(c) * 100) / 100}" inputmode="decimal" required></label>
    </div>
    <p class="text-[13px] text-ink2 bg-sunken rounded-xl px-3 py-2">${icon('arrow-right-circle', 'w-4 h-4 inline -mt-0.5 text-brand')} El siguiente recibo quedará para el <strong class="font-semibold">${fFecha(nuevo, { day: 'numeric', month: 'long', year: 'numeric' })}</strong>.${esAniv ? ' Este pago es la <strong class="font-semibold">renovación anual</strong>: la póliza contará como conservada.' : ''}</p>
    <div class="flex gap-2 pt-2"><button type="button" class="btn-ghost" data-act="cerrar">Cancelar</button><button class="btn-primary flex-1">${icon('check', 'w-4 h-4')} Confirmar pago</button></div>
  </form>`);
}

/* ---------- Importar cartera desde Excel (CSV) ---------- */
const COLUMNAS_CARTERA = [
  ['nombre', 'Nombre completo'], ['telefono', 'Teléfono'], ['whatsapp', 'WhatsApp'], ['email', 'Email'], ['ramo', 'Ramo'],
  ['aseguradora', 'Aseguradora'], ['poliza', 'Número de póliza'], ['formaPago', 'Forma de pago'], ['inicioVigencia', 'Inicio de vigencia'],
  ['proxVencimiento', 'Próximo vencimiento'], ['prima', 'Prima anual'], ['moneda', 'Moneda'], ['prioridad', 'Prioridad'],
];
const normal = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
function leerCSV(texto) {
  texto = texto.replace(/^\ufeff/, '');
  const primera = texto.split(/\r?\n/)[0];
  const sep = (primera.match(/;/g) || []).length >= (primera.match(/,/g) || []).length ? ';' : ',';
  const filas = []; let fila = [], celda = '', comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (comillas) { if (ch === '"') { if (texto[i + 1] === '"') { celda += '"'; i++; } else comillas = false; } else celda += ch; }
    else if (ch === '"') comillas = true;
    else if (ch === sep) { fila.push(celda); celda = ''; }
    else if (ch === '\n') { fila.push(celda); filas.push(fila); fila = []; celda = ''; }
    else if (ch !== '\r') celda += ch;
  }
  if (celda || fila.length) { fila.push(celda); filas.push(fila); }
  return filas.filter(f => f.some(c => c.trim()));
}
function leerFecha(v) {
  v = String(v || '').trim(); if (!v) return '';
  let m = v.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = v.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  return '';
}
function leerMonto(v) {
  let t = String(v || '').replace(/[^\d.,-]/g, ''); if (!t) return 0;
  const p = t.lastIndexOf('.'), c = t.lastIndexOf(',');
  if (p > -1 && c > -1) t = p > c ? t.replace(/,/g, '') : t.replace(/\./g, '').replace(',', '.');
  else { const s = p > -1 ? '.' : c > -1 ? ',' : null;
    if (s) { const partes = t.split(s); t = partes.length > 2 || partes[partes.length - 1].length === 3 ? partes.join('') : partes.join('.'); } }
  return Number(t) || 0;
}
const elegir = (v, lista, defecto) => { const n = normal(v); return lista.find(x => normal(x) === n) || lista.find(x => n && normal(x).startsWith(n.slice(0, 4))) || defecto; };
function importarCartera(texto) {
  const filas = leerCSV(texto);
  if (filas.length < 2) { toast('El archivo no tiene filas de clientes.', { tono: 'bad' }); return; }
  const cab = filas[0].map(normal);
  const idx = Object.fromEntries(COLUMNAS_CARTERA.map(([k, t]) => [k, cab.findIndex(h => h === normal(t) || h === normal(k) || (k === 'poliza' && h.includes('poliza')) || (k === 'prima' && h.startsWith('prima')))]));
  if (idx.nombre < 0) { toast('No encontré la columna "Nombre completo". Usa la plantilla.', { tono: 'bad' }); return; }
  const val = (f, k) => idx[k] >= 0 ? String(f[idx[k]] || '').trim() : '';
  const nuevos = filas.slice(1).filter(f => val(f, 'nombre')).map(f => {
    const formaPago = elegir(val(f, 'formaPago'), Object.keys(FORMAS), 'Anual');
    const inicioVigencia = leerFecha(val(f, 'inicioVigencia'));
    const aseg = val(f, 'aseguradora');
    const c = { id: uid(), nombre: val(f, 'nombre'), telefono: val(f, 'telefono'), whatsapp: val(f, 'whatsapp') || val(f, 'telefono'), email: val(f, 'email'),
      ocupacion: '', edad: '36-45', civil: 'Casado(a)', hijos: 0, prioridad: elegir(val(f, 'prioridad'), PRIORIDADES, 'Media'),
      ramo: elegir(val(f, 'ramo'), RAMOS, 'Vida'), aseguradora: elegir(aseg, ALIADAS, aseg), poliza: val(f, 'poliza'), formaPago, inicioVigencia,
      proxVencimiento: leerFecha(val(f, 'proxVencimiento')), prima: leerMonto(val(f, 'prima')), moneda: /us|dol/i.test(val(f, 'moneda')) ? 'USD' : 'COP',
      etapa: 'prospecto', estado: 'Prospecto Frío', gracia: false, renovadoEn: null, renovaciones: 0, fueCliente: false, hitos: {}, notas: [], citas: [], pagos: [], creado: hoy() };
    if (c.poliza && c.inicioVigencia) {
      c.etapa = 'emitida'; c.estado = 'Cliente Activo'; c.fueCliente = true;
      if (!c.proxVencimiento) c.proxVencimiento = reciboVigente(c.inicioVigencia, c.formaPago);
    }
    return c;
  });
  if (!nuevos.length) { toast('No encontré clientes con nombre en el archivo.', { tono: 'bad' }); return; }
  const nClientes = nuevos.filter(esCliente).length;
  if (!confirm(`Voy a agregar ${nuevos.length} contactos: ${nClientes} con póliza (van a Posventa) y ${nuevos.length - nClientes} sin póliza (van a Ventas).${db.esDemo ? '\n\nTambién quitaré los contactos de ejemplo (los que tú agregaste se quedan).' : ''}\n\n¿Continuar?`)) return;
  foto();
  if (db.esDemo) { db.contactos = db.contactos.filter(c => !c.demo); db.esDemo = false; }
  db.contactos.push(...nuevos);
  guardar(); cerrarModal(); location.hash = nClientes ? 'posventa' : 'ventas'; render();
  toast(`${nuevos.length} contactos cargados`, { deshacer: true });
}

function moverEtapa(c, etapa) {
  if (c.etapa === etapa) return;
  if (etapa === 'emitida') {
    if (!c.aseguradora || !c.poliza || !c.inicioVigencia) {
      c._pendienteEmitir = true; guardar();
      abrirFormContacto(c.id, 'Para pasar a posventa completa aseguradora, número de póliza e inicio de vigencia.');
      return 'pendiente';
    }
    c.hitos = { ...c.hitos, cierre: c.hitos?.cierre || hoy() };
    c.fueCliente = true;
    if (!c.proxVencimiento) c.proxVencimiento = reciboVigente(c.inicioVigencia, c.formaPago);
    c.estado = 'Cliente Activo';
  } else if (etapa === 'standby') c.estado = 'Standby';
  else if (etapa === 'cancelada') c.estado = 'Cancelada';
  else {
    const mapa = { prospecto: c.estado === 'Contactado' ? 'Contactado' : 'Prospecto Frío', cita1: 'Cita 1 Agendada', propuesta: 'Cita 1 Realizada', cita2: 'Cita 2 Agendada', tramite: 'En Trámite' };
    c.estado = mapa[etapa];
  }
  c.etapa = etapa;
}

/* ---------- Delegación de eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    const cub = e.target.closest('[data-cubeta]');
    if (cub && cub.tagName === 'A') ui.cubetaMovil = cub.dataset.cubeta;
    return;
  }
  if (el.tagName === 'A' && el.getAttribute('href')?.startsWith('http')) return;
  const fn = acciones[el.dataset.act];
  if (!fn) return;
  e.preventDefault(); e.stopPropagation();
  fn(el.dataset, el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.querySelector('#modal-root [role=dialog]')) acciones.cerrar();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('article[data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const btn = f.querySelector('button:not([type=button])');
  if (btn?.disabled) return;
  if (btn) { btn.disabled = true; setTimeout(() => (btn.disabled = false), 600); }
  formularios[f.dataset.form](f, new FormData(f));
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  if (el.dataset.change === 'etapa') {
    foto(); const c = getC(el.dataset.id);
    const r = moverEtapa(c, el.value);
    if (r === 'pendiente') return;
    guardar(); render(); abrirDetalle(c.id, true); toast(`Movido a ${el.selectedOptions[0].text}`, { deshacer: true });
  }
  if (el.dataset.change === 'estado') { foto(); const c = getC(el.dataset.id); c.estado = el.value; guardar(); render(); abrirDetalle(c.id, true); toast('Estado actualizado', { deshacer: true }); }
  if (el.dataset.change === 'aseg') { const f = el.closest('form'); const otra = f.querySelector('[data-otra]'); otra.classList.toggle('hidden', el.value !== 'Otra'); if (el.value === 'Otra') f.aseguradoraOtra.focus(); }
  if (el.dataset.change === 'etapa-form' && ['tramite', 'emitida'].includes(el.value)) el.closest('form').querySelector('[data-poliza]').open = true;
  if (el.dataset.change === 'cartera') {
    const file = el.files[0]; if (!file) return;
    file.text().then(t => importarCartera(t)).catch(() => toast('No pude leer ese archivo. Guárdalo desde Excel como "CSV".', { tono: 'bad' }));
    el.value = '';
  }
  if (el.dataset.change === 'importar') {
    const file = el.files[0]; if (!file) return;
    file.text().then(t => {
      const d = JSON.parse(t);
      if (!d || !Array.isArray(d.contactos)) throw new Error('formato');
      if (!confirm(`Este respaldo tiene ${d.contactos.length} contactos y reemplazará lo que ves ahora. ¿Continuar?`)) return;
      foto(); db = d; db.ajustes = db.ajustes || { usd: TASA_USD_INICIAL }; guardar(); cerrarModal(); render(); toast('Respaldo cargado', { deshacer: true });
    }).catch(() => toast('Ese archivo no es un respaldo de Lirios CRM.', { tono: 'bad' }));
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'buscador') {
    ui.busqueda = e.target.value;
    const q = ui.busqueda.trim().toLowerCase();
    const lista = db.contactos.filter(c => aplicaFiltro(c, ui.filtro)).filter(c => !q || [c.nombre, c.poliza, c.prioridad, c.telefono, c.email, c.aseguradora, c.ramo].join(' ').toLowerCase().includes(q)).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    document.getElementById('lista-contactos').innerHTML = listaContactos(lista);
    pintarIconos();
  }
  const err = e.target.closest('.field')?.querySelector('[data-err]');
  if (err) err.classList.add('hidden');
});

/* Arrastrar y soltar en el pipeline (computadora) */
document.addEventListener('dragstart', e => { const card = e.target.closest('[data-drag]'); if (card) { e.dataTransfer.setData('text/plain', card.dataset.drag); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const col = e.target.closest('[data-drop]'); if (col) { e.preventDefault(); document.querySelectorAll('.drop-target').forEach(x => x !== col && x.classList.remove('drop-target')); col.classList.add('drop-target'); } });
document.addEventListener('dragleave', e => { const col = e.target.closest('[data-drop]'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('drop-target'); });
document.addEventListener('drop', e => {
  const col = e.target.closest('[data-drop]'); if (!col) return;
  e.preventDefault(); col.classList.remove('drop-target');
  const c = getC(e.dataTransfer.getData('text/plain')); if (!c || c.etapa === col.dataset.drop) return;
  foto();
  const r = moverEtapa(c, col.dataset.drop);
  if (r === 'pendiente') return;
  guardar(); render();
  toast(`${c.nombre.split(' ')[0]} → ${VENTAS.find(v => v.id === col.dataset.drop).nombre}`, { deshacer: true });
});

window.addEventListener('hashchange', () => { ui.vista = location.hash.slice(1) || 'hoy'; cerrarModal(); render(); window.scrollTo(0, 0); });
window.addEventListener('storage', e => { if (e.key === STORAGE_KEY && e.newValue) { db = JSON.parse(e.newValue); render(); } });

render();
</script>
</body>
</html>
